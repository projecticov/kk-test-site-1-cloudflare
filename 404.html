<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Hub</title>
<script>
  /* GitHub Pages отдаёт этот файл на любой несуществующий адрес.
     Уводим на само приложение по абсолютному пути: прежний относительный
     «./index.html» из вложенной папки (/pwa/index.html) указывал на ту же
     самую 404 и вызывал бесконечную перезагрузку страницы. */
  (function () {
    var first = location.pathname.split('/').filter(Boolean)[0] || '';
    var root = (first && first.indexOf('.') === -1) ? '/' + first + '/' : '/';
    if (location.pathname === root) return;            /* защита от петли */
    location.replace(root + (location.hash || ''));
  })();
</script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       display:grid;place-items:center;min-height:100vh;margin:0;
       background:#f7f7fa;color:#14151a}
</style>
</head><body><p>Открываю Student Hub…</p></body></html>
