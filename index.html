        status: v('ev-status'),
        tags: v('ev-tags').split(',').map((s) => s.trim()).filter(Boolean),
        eligibility: 'Все классы',
        isFree: true
      });
      ui.closeSheet();
      ui.toast(id ? 'Событие обновлено' : 'Событие создано');
      SH.app.render();
    },

    removeEvent(id) {
      ui.confirmSheet('Удалить событие?', 'Оно исчезнет из приложения у всех учеников.', 'Удалить', () => {
        store.deleteEvent(id);
        ui.toast('Удалено');
        SH.app.render();
      });
    },

    moderate(id, action) {
      if (action === 'delete') store.deletePost(id);
      else store.setPostStatus(id, action);
      ui.toast(action === 'hidden' ? 'Скрыто' : action === 'delete' ? 'Удалено' : 'Оставлено');
      SH.app.render();
    },

    invite() {
      const link = location.origin + location.pathname;
      ui.sheet({
        title: 'Пригласить учеников',
        subtitle: 'Отправь ссылку в классный чат',
        body:
          '<div class="card" style="background:var(--chip);border:0"><div class="small muted" style="margin-bottom:6px">Ссылка на приложение</div>' +
          '<div style="font-size:13px;word-break:break-all">' + e(link) + '</div></div>' +
          '<button class="btn btn--brand btn--block mt-16" onclick="SH.views.admin.copyInvite(\'' + e(link) + '\')">Скопировать</button>' +
          '<p class="small muted center mt-12" style="line-height:1.5">Ученик открывает ссылку, нажимает «Добавить на главный экран» — и приложение у него как обычное.</p>'
      });
    },

    copyInvite(link) {
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => ui.toast('Ссылка скопирована'));
      else ui.toast('Скопируй вручную');
    },

    exportCsv() {
      const rows = [['Ученик', 'Класс', 'Интересы', 'Заявок']];
      store.state.users.filter((u) => u.role === 'student').forEach((u) => {
        rows.push([u.name, u.grade || '', (u.interests || []).join('; '),
          store.state.applications.filter((a) => a.userId === u.id).length]);
      });
      const csv = rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'student-hub-ученики.csv';
      a.click();
      ui.toast('CSV скачан');
    },

    saveEndpoint() {
      const el = document.getElementById('ai-endpoint');
      ai.endpoint = el ? el.value.trim() : '';
      ui.toast(ai.endpoint ? 'Прокси подключён' : 'Локальный режим');
    }
  };

  SH.views = SH.views || {};
  SH.views.admin = Object.assign({ html }, actions);
})(window.SH = window.SH || {});

/* Установка PWA — та самая «инструкция в 3 шага» */
(function (SH) {
  'use strict';
  const { ui, store, icon } = SH;
  const e = ui.esc;

  function platform() {
    const ua = navigator.userAgent;
    if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'ios';
    if (/Android/.test(ua)) return 'android';
    return 'desktop';
  }

  function stepsHtml() {
    const p = platform();
    if (p === 'ios') {
      return [
        ['Открой сайт в <b>Safari</b>', 'Chrome на iPhone установку не поддерживает — нужен именно Safari.'],
        ['Нажми кнопку <b>«Поделиться»</b>', 'Квадрат со стрелкой вверх внизу экрана.'],
        ['Выбери <b>«На экран Домой»</b>', 'Иконка появится рядом с остальными приложениями.']
      ];
    }
    if (p === 'android') {
      return [
        ['Открой сайт в <b>Chrome</b>', 'Подойдёт любой современный браузер на Android.'],
        ['Нажми <b>«Установить приложение»</b>', 'Кнопка в шапке сайта или пункт в меню «⋮».'],
        ['Готово — иконка на главном экране', 'Открывается без адресной строки, как обычное приложение.']
      ];
    }
    return [
      ['Открой сайт в <b>Chrome или Edge</b>', 'Подойдёт любой браузер на Chromium.'],
      ['Нажми <b>иконку установки</b> в адресной строке', 'Или меню «⋮» → «Установить Student Hub».'],
      ['Готово — приложение в системе', 'Запускается в отдельном окне, без вкладок.']
    ];
  }

  function html() {
    const installed = SH.install.isStandalone();
    const canPrompt = !!SH.install.promptEvent;

    return (
      '<div class="screen" style="padding-top:calc(var(--safe-t) + 26px)">' +
        '<div class="screen-head" style="margin-bottom:22px">' +
          '<button class="icon-btn icon-btn--plain" onclick="SH.app.back()" aria-label="Назад">' + icon('arrowLeft', 21) + '</button>' +
        '</div>' +

        '<div style="text-align:center;margin-bottom:24px">' +
          '<div style="display:inline-block;padding:10px;border-radius:26px;background:var(--surface);box-shadow:var(--shadow-md)">' +
            SH.logoMark(76) +
          '</div>' +
          '<h1 style="font-size:25px;letter-spacing:-0.8px;margin:16px 0 8px">' +
            (installed ? 'Уже установлено' : 'Добавь на главный экран') + '</h1>' +
          '<p class="muted" style="margin:0 auto;max-width:310px;font-size:14px;line-height:1.55">' +
            (installed
              ? 'Student Hub открывается как обычное приложение — без браузера и вкладок.'
              : 'Одно нажатие — и Student Hub будет рядом с остальными приложениями. Без магазина и скачивания.') +
          '</p>' +
        '</div>' +

        (installed
          ? '<div class="card" style="text-align:center;padding:22px">' +
              '<div style="color:var(--success);display:flex;justify-content:center;margin-bottom:10px">' + icon('checkCircle', 34) + '</div>' +
              '<b>Приложение установлено</b>' +
              '<p class="small muted" style="margin:6px 0 0">Уведомления и офлайн-режим работают.</p>' +
            '</div>'
          : canPrompt
            ? '<button class="btn btn--brand btn--block" style="height:56px;font-size:16px" onclick="SH.install.prompt()">' +
                icon('install', 20) + 'Установить приложение</button>' +
              '<p class="center small muted mt-12">Одна кнопка — без инструкций</p>'
            : '') +

        (!installed ? '<div class="card mt-20">' +
          '<div class="row" style="margin-bottom:14px">' +
            '<b style="font-size:14px">Как это сделать</b>' +
            '<span class="spacer"></span>' +
            '<span class="tag">' + (platform() === 'ios' ? 'iPhone / iPad' : platform() === 'android' ? 'Android' : 'Компьютер') + '</span>' +
          '</div>' +
          '<div class="steps">' +
            stepsHtml().map((s, i) =>
              '<div class="step"><span class="step__num">' + (i + 1) + '</span>' +
              '<div class="step__body"><b>' + s[0] + '</b><div class="muted" style="margin-top:2px">' + s[1] + '</div></div></div>'
            ).join('') +
          '</div>' +
        '</div>' : '') +

        '<div class="section-head"><span class="h2">Что даёт установка</span></div>' +
        '<div class="list">' +
          benefit('bolt', 'Открывается мгновенно', 'Иконка на главном экране, без ввода адреса') +
          benefit('wifiOff', 'Работает без интернета', 'Кэш хранит приложение и данные') +
          benefit('bell', 'Уведомления о дедлайнах', 'Не пропустишь последний день') +
          benefit('install', 'Не занимает память', 'Пара мегабайт вместо сотни') +
        '</div>' +

        (!installed ? '<button class="btn btn--ghost btn--block mt-20" onclick="SH.views.install.dismiss()">Не сейчас</button>' : '') +
        '<div style="height:10px"></div>' +
      '</div>'
    );
  }

  function benefit(ico, title, sub) {
    return '<div class="item">' +
      '<span class="empty__icon" style="width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary);margin:0">' +
        icon(ico, 18) + '</span>' +
      '<div class="grow"><div style="font-weight:650;font-size:13.5px">' + e(title) + '</div>' +
      '<div class="small muted">' + e(sub) + '</div></div></div>';
  }

  SH.views = SH.views || {};
  SH.views.install = {
    html,
    dismiss() { store.dismissInstall(); ui.toast('Можно вернуться позже'); SH.app.back(); }
  };
})(window.SH = window.SH || {});

/* Роутер и оболочка приложения */
(function (SH) {
  'use strict';
  const { ui, store, icon } = SH;

  /* ─────────────────────────── установка PWA ─────────────────────────── */

  const install = {
    promptEvent: null,
    isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    },
    async prompt() {
      if (!this.promptEvent) {
        ui.toast('Открой меню браузера → «Установить приложение»');
        return;
      }
      this.promptEvent.prompt();
      const choice = await this.promptEvent.userChoice;
      this.promptEvent = null;
      if (choice.outcome === 'accepted') {
        ui.toast('Готово! Иконка на главном экране');
        SH.app.render();
      }
    },
    init() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        this.promptEvent = e;
        if (location.hash === '#/install') SH.app.render();
      });
      window.addEventListener('appinstalled', () => {
        this.promptEvent = null;
        ui.toast('Student Hub установлен ✓');
        SH.app.render();
      });
    }
  };

  /* ─────────────────────────── роутер ─────────────────────────── */

  const TABS = [
    ['explore', 'explore', 'Explore'],
    ['community', 'groups', 'Сообщество'],
    ['roadmap', 'map', 'Роадмап'],
    ['chats', 'chat', 'Чаты'],
    ['profile', 'person', 'Профиль']
  ];

  function parse() {
    const raw = location.hash.replace(/^#\/?/, '');
    const parts = raw.split('/').filter(Boolean);
    if (!parts.length) return { name: 'explore', params: [] };
    return { name: parts[0], params: parts.slice(1) };
  }

  function isTab(name) { return TABS.some(([id]) => id === name); }

  function screenFor(route) {
    const [p1, p2] = route.params;
    switch (route.name) {
      case 'explore': return { html: SH.views.explore.html(), mount: SH.views.explore.mount };
      case 'event': return { html: SH.views.explore.detail(p1) };
      case 'all': return { html: SH.views.explore.all(p1) };
      case 'community': return { html: SH.views.community.html() };
      case 'roadmap': return { html: SH.views.roadmap.html() };
      case 'chats': return { html: SH.views.chats.html() };
      case 'chat': return { html: SH.views.chats.thread(p1), mount: (root) => SH.views.chats.mountThread(root, p1) };
      case 'profile': return { html: SH.views.profile.html() };
      case 'auth': return { html: SH.views.profile.auth(p1 === 'register' ? 'register' : 'login') };
      case 'install': return { html: SH.views.install.html() };
      case 'admin': return { html: SH.views.admin.html(), wide: true };
      default: return { html: SH.views.explore.html(), mount: SH.views.explore.mount };
    }
  }

  let lastRouteKey = null;

  /* экраны, доступные без входа */
  const PUBLIC = ['auth', 'install'];

  function render() {
    let route = parse();

    // гард: без сессии — только вход и экран установки
    if (!store.isAuthed && PUBLIC.indexOf(route.name) === -1) {
      if (location.hash !== '#/auth') {
        location.replace('#/auth');
        return;
      }
      route = { name: 'auth', params: [] };
    }

    // авторизованному на экране входа делать нечего
    if (store.isAuthed && route.name === 'auth') {
      location.replace('#/explore');
      return;
    }

    const key = location.hash || '#/explore';
    const root = document.getElementById('root');
    const view = screenFor(route);

    const tabbar = isTab(route.name) ? buildTabbar(route.name) : '';

    root.innerHTML =
      (view.wide ? '' : '<div class="app">') +
      view.html +
      tabbar +
      (view.wide ? '' : '</div>');

    if (view.mount) {
      try { view.mount(root); } catch (err) { console.warn('mount error', err); }
    }

    if (key !== lastRouteKey) {
      window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      lastRouteKey = key;
    }
    document.title = pageTitle(route);
  }

  function pageTitle(route) {
    const names = {
      explore: 'Explore', event: 'Событие', community: 'Сообщество',
      roadmap: 'Роадмап', chats: 'Чаты', chat: 'Чат', profile: 'Профиль',
      auth: 'Вход', install: 'Установка', admin: 'Админ-панель', all: 'События'
    };
    return 'Student Hub — ' + (names[route.name] || 'Главная');
  }

  function buildTabbar(active) {
    const unread = store.unreadTotal();
    return '<nav class="tabbar" role="tablist">' +
      TABS.map(([id, ico, label]) =>
        '<button class="tab" role="tab" aria-selected="' + (id === active) + '" onclick="SH.app.go(\'#/' + id + '\')">' +
          icon(ico) +
          (id === 'chats' && unread ? '<span class="dot-badge"></span>' : '') +
          '<span>' + label + '</span>' +
        '</button>'
      ).join('') +
    '</nav>';
  }

  const app = {
    go(hash) {
      if (location.hash === hash) { render(); return; }
      location.hash = hash;
    },
    back() {
      if (history.length > 1) history.back();
      else app.go('#/explore');
    },
    render
  };

  /* ─────────────────────────── старт ─────────────────────────── */

  function boot() {
    store.init();
    install.init();

    store.on(() => render());

    window.addEventListener('hashchange', render);

    // тема «как в системе» должна реагировать на смену настроек ОС
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (store.state.settings.theme === 'system') SH.applyTheme('system');
      });
    }

    // индикатор офлайна
    window.addEventListener('offline', () => ui.toast('Нет интернета — работаем из кэша'));
    window.addEventListener('online', () => ui.toast('Снова онлайн'));

    if (!location.hash) location.hash = '#/explore';
    render();

    // сессия по сохранённому токену + данные из D1
    if (SH.api && SH.api.enabled()) {
      store.restoreSession().then((restored) => {
        if (restored) render();
        // публичные данные (события) подтягиваем и без входа —
        // экран входа показывает живой контент
        return SH.api.bootstrap();
      }).then((snapshot) => {
        if (snapshot && store.hydrate(snapshot)) render();
      }).catch(() => {});
    }

    // service worker (в однофайловой сборке лежит рядом в ./pwa/)
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./pwa/sw.js').catch((err) => console.warn('SW не зарегистрирован:', err.message));
      });
    }
  }

  SH.app = app;
  SH.install = install;
  document.addEventListener('DOMContentLoaded', boot);
})(window.SH = window.SH || {});

/* ── адрес бэкенда (меняется при сборке) ── */

</script>
