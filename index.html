    markFailed(id) { return store.touchMessage(id, { pending: false, failed: true }); },
    readChat(id) {
      const c = store.chat(id);
      if (c && c.unread) {
        c.unread = 0; emit('chats');
        SH.api && SH.api.push('POST', '/api/chats/' + id + '/read');
      }
    },
    unreadTotal() {
      return store.chats().reduce((s, c) => s + (c.unread || 0), 0);
    },

    /* ── роадмап ── */
    goals() {
      const u = store.currentUser;
      return u ? state.goals.filter((g) => g.userId === u.id) : [];
    },
    addGoal(title) {
      const u = store.currentUser;
      if (!u) return null;
      const g = { id: uid('g'), userId: u.id, title, createdAt: iso(now()) };
      state.goals.push(g);
      emit('goals');
      SH.api && SH.api.push('POST', '/api/goals', { id: g.id, title });
      return g;
    },
    deleteGoal(id) {
      state.goals = state.goals.filter((g) => g.id !== id);
      state.tasks = state.tasks.filter((t) => t.goalId !== id);
      emit('goals');
      SH.api && SH.api.push('DELETE', '/api/goals/' + id);
    },
    tasks(goalId) {
      const u = store.currentUser;
      return state.tasks.filter((t) => t.userId === (u ? u.id : null) && (!goalId || t.goalId === goalId));
    },
    goalProgress(goalId) {
      const list = state.tasks.filter((t) => t.goalId === goalId);
      if (!list.length) return 0;
      return Math.round((list.filter((t) => t.status === 'done').length / list.length) * 100);
    },
    toggleTask(id) {
      const t = state.tasks.find((x) => x.id === id);
      if (!t) return;
      t.status = t.status === 'done' ? 'planned' : 'done';
      emit('tasks');
      SH.api && SH.api.push('PATCH', '/api/tasks/' + id, { status: t.status });
    },
    addTask(goalId, title, dateLabel) {
      const u = store.currentUser;
      if (!u) return;
      const task = { id: uid('tk'), goalId, userId: u.id, title, dateLabel: dateLabel || '', status: 'planned' };
      state.tasks.push(task);
      emit('tasks');
      SH.api && SH.api.push('POST', '/api/tasks', task);
    },
    replaceTasks(goalId, list) {
      state.tasks = state.tasks.filter((t) => t.goalId !== goalId);
      const u = store.currentUser;
      list.forEach((t, i) => {
        state.tasks.push({ id: uid('tk'), goalId, userId: u ? u.id : null, title: t.title, dateLabel: t.dateLabel || '', status: i === 0 ? 'current' : 'planned' });
      });
      emit('tasks');
      SH.api && SH.api.push('PUT', '/api/goals/' + goalId + '/plan', { tasks: list });
    },

    /* ── роадмап: вехи, марафоны, задачи дня ── */

    plan() {
      const u = store.currentUser;
      if (!u) return [];
      return (state.plan || [])
        .filter((p) => p.userId === u.id)
        .sort((a, b) => String(a.startAt).localeCompare(String(b.startAt)));
    },
    planItem(id) { return (state.plan || []).find((p) => p.id === id) || null; },

    addPlanItem(item) {
      const u = store.currentUser;
      if (!u) return null;
      const row = Object.assign({
        id: uid('p'), userId: u.id, kind: 'task', title: '', note: '',
        startAt: iso(now()), endAt: '', done: false, eventId: '', checklist: [], color: 'sky'
      }, item, { userId: u.id });
      if (!state.plan) state.plan = [];
      state.plan.push(row);
      emit('plan');
      SH.api && SH.api.push('POST', '/api/plan/items', {
        id: row.id, kind: row.kind, title: row.title, note: row.note,
        startAt: row.startAt, endAt: row.endAt, checklist: row.checklist, color: row.color,
        eventId: row.eventId || '', done: !!row.done
      });
      return row;
    },

    updatePlanItem(id, patch) {
      const row = store.planItem(id);
      if (!row) return null;
      Object.assign(row, patch);
      emit('plan');
      const body = {};
      ['title', 'note', 'startAt', 'endAt', 'done', 'checklist', 'color'].forEach((k) => {
        if (patch[k] !== undefined) body[k] = patch[k];
      });
      SH.api && SH.api.push('PATCH', '/api/plan/items/' + id, body);
      return row;
    },

    deletePlanItem(id) {
      state.plan = (state.plan || []).filter((p) => p.id !== id);
      emit('plan');
      SH.api && SH.api.push('DELETE', '/api/plan/items/' + id);
    },

    /* чек-лист внутри марафона */
    addPlanCheck(itemId, text) {
      const row = store.planItem(itemId);
      if (!row || !String(text || '').trim()) return;
      row.checklist = (row.checklist || []).concat({ id: uid('ch'), text: String(text).trim(), done: false });
      store.updatePlanItem(itemId, { checklist: row.checklist });
    },
    togglePlanCheck(itemId, checkId) {
      const row = store.planItem(itemId);
      if (!row) return;
      row.checklist = (row.checklist || []).map((c) => c.id === checkId ? Object.assign({}, c, { done: !c.done }) : c);
      store.updatePlanItem(itemId, { checklist: row.checklist });
    },
    removePlanCheck(itemId, checkId) {
      const row = store.planItem(itemId);
      if (!row) return;
      store.updatePlanItem(itemId, { checklist: (row.checklist || []).filter((c) => c.id !== checkId) });

    /* ── настройки ── */
    setTheme(theme) {
      state.settings.theme = theme;
      applyTheme(theme);
      emit('settings');
    },
    dismissInstall() {
      state.settings.installDismissed = true;
      emit('settings');
    },
    /** Применить снапшот из облака (D1) поверх локального состояния. */
    hydrate(remote, quiet) {
      if (state.meta && state.meta.authNotice) state.meta.authNotice = '';
      if (!remote || !Array.isArray(remote.users) || !remote.users.length) return false;

      // Сообщения, которые ещё не доехали до сервера, живут только на устройстве.
      // Их нельзя стирать ответом сервера — иначе «отправил» превращается в «пропало».
      const pending = {};
      (state.chats || []).forEach((c) => {
        const mine = (c.messages || []).filter((m) => m && m.pending && !m.failed);
        if (mine.length) pending[c.id] = mine;
      });
      const fresh = ['users', 'events', 'posts', 'teams', 'goals', 'tasks', 'saved', 'orgs', 'plan'];
      fresh.forEach((f) => {
        if (Array.isArray(remote[f])) state[f] = remote[f];
      });

      if (Array.isArray(remote.chats)) {
        const known = new Set(remote.chats.map((c) => c.id));
        const localOnly = (state.chats || []).filter((c) => !known.has(c.id) &&
          (c.messages || []).some((m) => m && m.pending));
        state.chats = remote.chats.map((c) => {
          const add = pending[c.id];
          if (!add) return c;
          const msgs = (c.messages || []).slice();
          add.forEach((m) => { if (!msgs.some((x) => x.id === m.id)) msgs.push(m); });
          msgs.sort((a, b) => String(a.at).localeCompare(String(b.at)));
          return Object.assign({}, c, { messages: msgs });
        }).concat(localOnly);
      }
      state.meta = Object.assign({}, state.meta, {
        cloud: true,
        aiEnabled: !!remote.aiEnabled,
        syncedAt: remote.serverTime || new Date().toISOString()
      });
      // если активный пользователь «пропал» из базы — разлогиниваем.
      // Пустая сессия остаётся пустой: никаких подстановок первого попавшегося аккаунта.
      if (state.session.userId && !state.users.some((u) => u.id === state.session.userId)) {
        state.session.userId = null;
      }
      if (!quiet) emit('hydrate');
      else persist();
      return true;
    },

    reset() {
      state = seed();
      applyTheme(state.settings.theme);
      emit('reset');
    },

    /* ── админ-статистика ── */
    stats() {
      const students = state.users.filter((u) => u.role === 'student').length;
      return {
        students,
        admins: state.users.filter((u) => u.role === 'admin').length,
        events: state.events.filter((e) => e.status === 'published').length,
        drafts: state.events.filter((e) => e.status === 'draft').length,
        flagged: state.posts.filter((p) => p.status === 'flagged').length,
        posts: state.posts.filter((p) => p.status === 'published').length,
        saved: (state.saved || []).length
      };
    },
    userById(id) { return state.users.find((u) => u.id === id) || { name: 'Неизвестный', color: 'sky' }; }
  };

  function applyTheme(theme) {
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const resolved = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
    document.documentElement.setAttribute('data-theme', resolved);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', resolved === 'dark' ? '#121317' : '#F7F7FA');
  }

  SH.applyTheme = applyTheme;
  SH.store = store;
})(window.SH = window.SH || {});

/* UI-утилиты: форматирование, тосты, шиты, мелкие компоненты. */
(function (SH) {
  'use strict';

  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function plural(n, one, few, many) {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function relTime(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const min = Math.round(diff / 6e4);
    if (min < 1) return 'только что';
    if (min < 60) return min + ' мин назад';
    const h = Math.round(min / 60);
    if (h < 24) return h + ' ' + plural(h, 'час', 'часа', 'часов') + ' назад';
    const d = Math.round(h / 24);
    if (d === 1) return 'вчера';
    if (d < 7) return d + ' ' + plural(d, 'день', 'дня', 'дней') + ' назад';
    return shortDate(dateStr);
  }

  function shortDate(dateStr) {
    const d = new Date(dateStr);
    return d.getDate() + ' ' + MONTHS[d.getMonth()];
  }

  function deadlineInfo(dateStr) {
    const end = new Date(dateStr).getTime();
    const days = Math.ceil((end - Date.now()) / 864e5);
    if (days < 0) return { label: 'Дедлайн прошёл', tone: 'muted', urgent: false };
    if (days === 0) return { label: 'Сегодня последний день', tone: 'danger', urgent: true };
    if (days === 1) return { label: 'Остался 1 день', tone: 'danger', urgent: true };
    if (days <= 4) return { label: 'Осталось ' + days + ' дня', tone: 'warning', urgent: true };
    return { label: 'До ' + shortDate(dateStr), tone: 'muted', urgent: false };
  }

  function initials(name) {
    if (!name) return '?';
    const parts = String(name).trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  const AVATAR_BG = {
    sun: '#FFE8A3', mint: '#B9F5D0', sky: '#BFE3FF',
    blush: '#FFD3CC', lavender: '#E7DDFB', brand: '#14161F'
  };

  function avatar(user, size) {
    const u = user || {};
    const bg = AVATAR_BG[u.color] || AVATAR_BG.sun;
    const fg = u.color === 'brand' ? '#fff' : '#14151a';
    return '<span class="avatar avatar--' + (size || 40) + '" style="background:' + bg + ';color:' + fg + '">' +
      esc(initials(u.name)) + '</span>';
  }

  function cover(event, height, radius) {
    const cat = SH.store.CATEGORIES[event.category] || SH.store.CATEGORIES.event;
    const h = height || 150;
    const radiusCss = radius != null ? 'border-radius:' + radius + 'px;' : '';

    if (event.image) {
      return '<div class="cover cover--' + (event.category || 'event') + ' cover--photo" style="height:' + h + 'px;' + radiusCss + '">' +
        '<img src="' + esc(event.image) + '" alt="" loading="lazy" ' +
          'onerror="this.style.display=&quot;none&quot;">' +
        '</div>';
    }

    return '<div class="cover cover--' + event.category + '" style="height:' + h + 'px;' + radiusCss + '">' +
      '<span class="cover__glyph" style="opacity:.9;color:rgba(20,21,26,.42)">' +
        SH.icon(cat.glyph, Math.round(h * 0.34)) +
      '</span></div>';
  }

  /* ── тосты ── */
  let toastHost = null;
  function toast(text, ms) {
    if (!toastHost) {
      toastHost = document.createElement('div');
      toastHost.className = 'toast-wrap';
      document.body.appendChild(toastHost);
    }
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    toastHost.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .25s ease, transform .25s ease';
      el.style.opacity = '0';
      el.style.transform = 'translateY(8px)';
      setTimeout(() => el.remove(), 260);
    }, ms || 2400);
  }

  /* ── шиты ── */
  let openSheet = null;
  function sheet(opts) {
    closeSheet();
    const scrim = document.createElement('div');
    scrim.className = 'scrim';

    const el = document.createElement('div');
    el.className = 'sheet';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.innerHTML =
      '<div class="sheet__grab"></div>' +
      (opts.title ? '<h2 class="h2" style="margin:0 0 4px">' + esc(opts.title) + '</h2>' : '') +
      (opts.subtitle ? '<p class="small muted" style="margin:0 0 14px">' + esc(opts.subtitle) + '</p>' : '') +
      '<div class="sheet__body">' + (opts.body || '') + '</div>';

    document.body.appendChild(scrim);
    document.body.appendChild(el);

    function destroy() {
      el.classList.add('sheet--closing');
      scrim.style.transition = 'opacity .18s ease';
      scrim.style.opacity = '0';
      setTimeout(() => { el.remove(); scrim.remove(); }, 200);
      openSheet = null;
      document.body.style.overflow = '';
    }

    scrim.addEventListener('click', () => { if (opts.dismissible !== false) destroy(); });
    el.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', destroy));
    document.body.style.overflow = 'hidden';

    openSheet = { el, destroy };
    if (typeof opts.onMount === 'function') opts.onMount(el, destroy);
    return { el, destroy };
  }

  function closeSheet() {
    if (openSheet) openSheet.destroy();
  }

  function confirmSheet(title, text, confirmLabel, onConfirm) {
    sheet({
      title: title,
      body:
        '<p class="body muted" style="margin:0 0 20px">' + esc(text) + '</p>' +
        '<div class="row" style="gap:10px">' +
          '<button class="btn btn--soft grow" data-close>Отмена</button>' +
          '<button class="btn btn--danger grow" id="confirm-yes">' + esc(confirmLabel || 'Удалить') + '</button>' +
        '</div>',
      onMount(el, destroy) {
        el.querySelector('#confirm-yes').addEventListener('click', () => {
          destroy();
          onConfirm && onConfirm();
        });
      }
    });
  }

  /* ── поля форм ── */
  function field(id, label, opts) {
    const o = opts || {};
    const input = o.textarea
      ? '<textarea id="' + id + '" placeholder="' + esc(o.placeholder || '') + '">' + esc(o.value || '') + '</textarea>'
      : '<input id="' + id + '" type="' + (o.type || 'text') + '" value="' + esc(o.value || '') +
        '" placeholder="' + esc(o.placeholder || '') + '" ' + (o.autocomplete ? 'autocomplete="' + o.autocomplete + '"' : '') + '>';
    return '<div class="field"' + (o.style ? ' style="' + o.style + '"' : '') + '>' +
      (label ? '<label class="field-label" for="' + id + '">' + esc(label) + '</label>' : '') +
      input + '</div>';
  }

  function select(id, label, options, value) {
    return '<div class="field">' +
      (label ? '<label class="field-label" for="' + id + '">' + esc(label) + '</label>' : '') +
      '<select id="' + id + '">' + options.map((o) =>
        '<option value="' + esc(o.value) + '"' + (o.value === value ? ' selected' : '') + '>' + esc(o.label) + '</option>'
      ).join('') + '</select></div>';
  }

  function empty(icon, title, text, actionHtml) {
    return '<div class="empty">' +
      '<div class="empty__icon">' + SH.icon(icon || 'sparkles') + '</div>' +
      '<h3>' + esc(title) + '</h3>' +
      '<p>' + esc(text) + '</p>' +
      (actionHtml ? '<div class="mt-16">' + actionHtml + '</div>' : '') +
      '</div>';
  }

  function tag(text, tone) {
    return '<span class="tag' + (tone ? ' tag--' + tone : '') + '">' + esc(text) + '</span>';
  }

  function skeletonList(n) {
    let out = '<div class="list">';
    for (let i = 0; i < (n || 3); i++) {
      out += '<div class="card" style="display:flex;gap:12px;align-items:center">' +
        '<div class="skel" style="width:52px;height:52px;border-radius:14px"></div>' +
        '<div style="flex:1"><div class="skel" style="height:12px;width:70%;margin-bottom:8px"></div>' +
        '<div class="skel" style="height:10px;width:45%"></div></div></div>';
    }
    return out + '</div>';
  }

  function debounce(fn, ms) {
    let t;
    return function () {
      const args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(() => fn.apply(ctx, args), ms || 220);
    };
  }

  SH.ui = {
    esc, plural, relTime, shortDate, deadlineInfo, initials, avatar, cover,
    toast, sheet, closeSheet, confirmSheet, field, select, empty, tag, skeletonList, debounce,
    MONTHS
  };
})(window.SH = window.SH || {});

/* ==========================================================================
   ИИ-модуль.
   Сейчас работает локально (детерминированно, без сети) — это демо-режим,
   который всегда доступен офлайн и не упирается в лимиты.
   Для боевого режима: SH.ai.endpoint = '<URL Cloudflare Worker>' — тогда
   запросы уйдут через прокси на Gemini, а при ошибке автоматически
   откатятся на локальный расчёт (fallback).
   ========================================================================== */
(function (SH) {
  'use strict';

  const ai = {
    endpoint: '',            // например 'https://student-hub-ai.<account>.workers.dev/ai'
    model: 'gemini-2.0-flash',

    /* ── стабильный «рандом» по строке ── */
    hash(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return Math.abs(h);
    },

    /* ── подбор: насколько событие подходит ученику ── */
    matchPercent(event, user) {
      // без профиля (или с пустыми интересами) скоринг вырождается —
      // тогда разводим проценты по хешу, чтобы карточки не выглядели одинаково
      if (!user || !((user.interests || []).length || (user.skills || []).length)) {
        return 46 + (ai.hash(event.id + ((user && user.id) || '')) % 27);
      }
      const interests = (user.interests || []).map((s) => s.toLowerCase());
      const skills = (user.skills || []).map((s) => s.toLowerCase());
      const hay = (event.tags || []).concat([event.title, event.description, event.category])
        .join(' ').toLowerCase();

      let score = 30;
      interests.forEach((i) => { if (hay.includes(i)) score += 16; });
      skills.forEach((s) => { if (hay.includes(s)) score += 11; });

      const catBoost = {
        'ИИ': 'hackathon', 'Хакатоны': 'hackathon', 'Дизайн': 'competition',
        'Олимпиады': 'olympiad', 'Веб': 'course', 'Стартапы': 'competition',
        'Наука': 'event', 'Мобильная разработка': 'internship'
      };
      (user.interests || []).forEach((i) => { if (catBoost[i] === event.category) score += 12; });

      score += ai.hash(event.id + (user.id || '')) % 7;
      return Math.max(34, Math.min(98, score));
    },

    /* ── объяснение подбора человеческим языком ── */
    explain(event, user) {
      if (!user) return 'Заполни интересы в профиле — и подбор станет персональным.';
      const interests = user.interests || [];
      const skills = user.skills || [];
      const hay = (event.tags || []).concat([event.title, event.description]).join(' ').toLowerCase();
      const hitInterests = interests.filter((i) => hay.includes(i.toLowerCase()));
      const hitSkills = skills.filter((s) => hay.includes(s.toLowerCase()));

      const chunks = [];
      if (hitInterests.length) chunks.push('совпадает с интересами: ' + hitInterests.slice(0, 2).join(', '));
      if (hitSkills.length) chunks.push('совпадает с навыками: ' + hitSkills.slice(0, 2).join(', '));

      if (chunks.length) {
        return 'Подходит на ' + ai.matchPercent(event, user) + '% — ' + chunks.join('; ') + '.';
      }
      return 'Подходит на ' + ai.matchPercent(event, user) + '% — это направление пока не в твоих интересах, но даёт смежный опыт.';
    },

    /* ── рекомендация топ-событий ── */
    recommend(events, user, limit) {
      return events
        .map((e) => Object.assign({}, e, { match: ai.matchPercent(e, user) }))
        .sort((a, b) => b.match - a.match)
        .slice(0, limit || 3);
    },

    /* ── генерация роадмапа под цель ── */
    generateRoadmap(goalTitle) {
      const t = String(goalTitle).toLowerCase();
      const base = [];

      if (/поступ|вуз|универс|итмо|мфти|вшэ/.test(t)) {
        base.push(
          { title: 'Определить 3 целевых вуза и направления', dateLabel: 'эта неделя' },
          { title: 'Пройти пробное тестирование / диагностику', dateLabel: 'через 2 недели' },
          { title: 'Собрать портфолио: 2 проекта + 1 олимпиада', dateLabel: 'до конца месяца' },
          { title: 'Подготовить мотивационное письмо', dateLabel: 'до конца месяца' },
          { title: 'Подать документы в первый вуз', dateLabel: 'через 2 месяца' }

    digest() {

      const emptyProfiles = users.filter((u) => u.role === 'student' && (u.interests || []).length === 0).length;
      const soon = SH.store.events().filter((ev) => {
        const d = Math.ceil((new Date(ev.deadlineDate) - Date.now()) / 864e5);
        return d >= 0 && d <= 7;
      }).length;

      return [
        'В базе ' + s.students + ' учеников и ' + s.events + ' опубликованных событий.',
        soon
          ? 'У ' + soon + ' событий дедлайн на этой неделе — самое время напомнить о них в сообществе.'
          : 'На этой неделе дедлайнов нет — можно добавить новые события.',

          : 'Профили заполнены у всех учеников — подбор работает на полную.'

    },

    /* ── запрос к модели через воркер ──
       promptKey — ключ системного промта из админки ("plan", "why", "digest"),
       vars — значения для подстановки {{переменных}} в шаблон.            */
    async complete(payload) {
      const body = typeof payload === 'string' ? { prompt: payload } : Object.assign({}, payload);
      body.model = body.model || ai.model;

      // ключей нет — не дёргаем сервер зря, локальный расчёт лучше ошибки в консоли
      if (SH.store && SH.store.state && SH.store.state.meta && SH.store.state.meta.aiEnabled === false) return null;

      if (SH.api && SH.api.enabled()) {
        try { return await SH.api.ask(body); }
        catch (e) {
          console.warn('AI: сервер недоступен, локальный режим:', e.message);
          return null;
        }
      }
      if (!ai.endpoint) return null;
      try {
        const res = await fetch(ai.endpoint, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        return data.text || null;
      } catch (e) {
        console.warn('AI fallback на локальный режим:', e.message);
        return null;
      }

/* ==========================================================================
   Роадмап — «навигатор поступающего» в трёх масштабах.

   Макро   (#/roadmap)          — годы 9–12 класс: вехи и «змейки» марафонов.
   Неделя  (#/roadmap/w/<дата>)  — календарь недели и расписание дня.
   Плюс цели и шаги (ИИ-план) — свёрнутый блок внизу.

   Данные: store.plan() → plan_items на сервере (веха / марафон / задача).
   ========================================================================== */

    'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const MON = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

  const pad = (n) => (n < 10 ? '0' + n : '' + n);
  const keyOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  function parseKey(s) {
    const parts = String(s || '').split('-').map(Number);

    return midnight(new Date());

  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function shift(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function mondayOf(d) { const x = midnight(d); return shift(x, -((x.getDay() + 6) % 7)); }

  function plural(n, one, few, many) {
    const m10 = n % 10; const m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
    return many;
  }

  function myGrade() {
    const m = String((store.currentUser || {}).grade || '').match(/\d+/);
    const g = m ? parseInt(m[0], 10) : 11;
    return Math.min(12, Math.max(9, g));
  }
  function schoolYearStart(d) { return d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1; }

    if (d === 0) return 'сегодня';
    if (d === 1) return 'завтра';
    if (d === -1) return 'вчера';
    if (d > 0) return 'через ' + d + ' ' + plural(d, 'день', 'дня', 'дней');
    const n = -d;
    return n + ' ' + plural(n, 'день', 'дня', 'дней') + ' назад';
  }

  /* ─────────────────────────── общий каркас ─────────────────────────── */

  function head(title, sub, right) {
    return '<div class="screen-head">' +
      '<div class="grow"><h1 class="screen-title">' + e(title) + '</h1>' +
      (sub ? '<p class="screen-sub">' + e(sub) + '</p>' : '') + '</div>' +
      (right || '') +
    '</div>';
  }

  function modeSwitch(active, g) {
    const gg = [9, 10, 11, 12].indexOf(g) >= 0 ? '/' + g : '';
    return '<div class="rm-switch" role="tablist">' +
      '<button role="tab" aria-selected="' + (active === 'circle') + '" onclick="SH.app.go(\'#/roadmap/c' + gg + '\')">Круг</button>' +
      '<button role="tab" aria-selected="' + (active === 'calendar') + '" onclick="SH.app.go(\'#/roadmap/cal' + gg + '\')">Календарь</button>' +
    '</div>';
  }

  /* ─────────────────────────── МАКРО: годы и змейки ─────────────────────────── */

  function iconButton(ico, label, onclick) {
    return '<button class="icon-btn icon-btn--plain" onclick="' + onclick + '" aria-label="' + e(label) + '">' +
      icon(ico, 22) + '</button>';
  }

  /* ─────────────────────────── КРУГ: один учебный год ─────────────────────────── */

  const TAU = Math.PI * 2;
  const RC = 190;                      // центр viewBox

  const pt = (r, a) => [RC + r * Math.cos(a), RC + r * Math.sin(a)];
  const r2 = (n) => Math.round(n * 100) / 100;

  /* кольцевой сектор (от rIn до rOut между углами) */
  function sectorPath(rIn, rOut, a0, a1) {
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const [x0, y0] = pt(rOut, a0);
    const [x1, y1] = pt(rOut, a1);
    const [x2, y2] = pt(rIn, a1);
    const [x3, y3] = pt(rIn, a0);
    return 'M' + r2(x0) + ' ' + r2(y0) +
      ' A' + rOut + ' ' + rOut + ' 0 ' + large + ' 1 ' + r2(x1) + ' ' + r2(y1) +
      ' L' + r2(x2) + ' ' + r2(y2) +
      ' A' + rIn + ' ' + rIn + ' 0 ' + large + ' 0 ' + r2(x3) + ' ' + r2(y3) + ' Z';
  }

  /* дуга по окружности радиуса r */
  function arcPath(r, a0, a1) {
    const large = a1 - a0 > Math.PI ? 1 : 0;
    const [x0, y0] = pt(r, a0);
    const [x1, y1] = pt(r, a1);
    return 'M' + r2(x0) + ' ' + r2(y0) +
      ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + r2(x1) + ' ' + r2(y1);
  }

  /* палитра марафонов совпадает с CSS (--tc у .rm-track--*) */
  const TRACK_HEX = { sky: '#8fcaf7', mint: '#7fdc9f', sun: '#f2cf63', lavender: '#b9a6f2', blush: '#f5a9c4' };
  /* запасные оттенки: нужны, когда у двух марафонов совпал цвет */
  const ARC_EXTRA = ['#f7a072', '#5fc9c9', '#a8cf5a', '#e79ad0'];
  const ARC_ALL = Object.keys(TRACK_HEX).map((k) => TRACK_HEX[k]).concat(ARC_EXTRA);

  /* цвет дуги: свой у каждого марафона; если цвет повторяется — берём свободный */
  function arcColors() {
    const list = store.plan().filter((p) => p.kind === 'track' && p.endAt)
      .sort((a, b) => String(a.startAt).localeCompare(String(b.startAt)));
    const map = {};
    const used = {};
    list.forEach((p) => {
      let hex = TRACK_HEX[p.color] || ARC_ALL[0];
      if (used[hex]) hex = ARC_ALL.find((c) => !used[c]) || ARC_ALL[Object.keys(map).length % ARC_ALL.length];
      used[hex] = 1;
      map[p.id] = hex;
    });
    return map;
  }
  const trackColor = (c) => TRACK_HEX[c] || TRACK_HEX.sky;

  const MON_NOM = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
    'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  const MON3 = ['ЯНВ', 'ФЕВ', 'МАР', 'АПР', 'МАЙ', 'ИЮН', 'ИЮЛ', 'АВГ', 'СЕН', 'ОКТ', 'НОЯ', 'ДЕК'];
  const seasonOf = (m) => (m >= 8 && m <= 10 ? 'autumn' : m === 11 || m <= 1 ? 'winter' : m <= 4 ? 'spring' : 'summer');
  const yearLabel = (y) => y + '–' + String(y + 1).slice(2);

  /* «1 окт – 10 дек», а внутри месяца — «10 – 31 янв» */
  function rangeLabel(a, b) {
    const d1 = a.getDate();
    const d2 = b.getDate();
    return a.getMonth() === b.getMonth()
      ? d1 + ' – ' + d2 + ' ' + MON[b.getMonth()]
      : d1 + ' ' + MON[a.getMonth()] + ' – ' + d2 + ' ' + MON[b.getMonth()];
  }

  let circleGrade = null;      // выбранный класс — общий для «Круга» и «Календаря»
  let calFocus = null;         // месяц, к которому надо прокрутить календарь
  let calHash = null;

  /* класс → учебный год: 10 класс = 2026/27, 11 класс = 2027/28 и т. д. */
  function gradeState(gradeArg) {
    const myG = myGrade();
    const picked = [9, 10, 11, 12].indexOf(gradeArg) >= 0 ? gradeArg : circleGrade;
    const g = [9, 10, 11, 12].indexOf(picked) >= 0 ? picked : myG;
    circleGrade = g;
    const yearStart = schoolYearStart(today()) + (g - myG);
    return { g, myG, yearStart, y0: new Date(yearStart, 8, 1), y1: new Date(yearStart + 1, 8, 1) };
  }

  /* «Мой роадмап • 10 класс» — тот же выбор, что и на скриншоте */
  function gradePicker(current, kind, route) {
    const opts = [9, 10, 11, 12].map((gg) => {
      const ys = schoolYearStart(today()) + (gg - myGrade());
      const label = kind === 'year' ? yearLabel(ys) : gg + ' класс';
      return '<option value="' + gg + '"' + (gg === current ? ' selected' : '') + '>' +
        'Мой роадмап • ' + label + '</option>';
    }).join('');
    return '<div class="rm-pick">' +
      '<select aria-label="Класс и учебный год" onchange="SH.views.roadmap.pickGrade(this.value, \'' + route + '\')">' +
        opts + '</select>' +
      '<span class="rm-pick__chev">' + icon('chevronRight', 16) + '</span>' +
    '</div>';
  }

  function circleScreen(gradeArg) {
    const t = today();
    const st = gradeState(gradeArg);
    const g = st.g;
    const y0 = st.y0;
    const y1 = st.y1;
    const span = y1 - y0;
    const ang = (d) => -Math.PI / 2 + ((d - y0) / span) * TAU;   // сентябрь — наверху
    const inYear = (d) => d >= y0 && d < y1;

    const items = store.plan();
    const colors = arcColors();
    const taskDays = {};
    items.filter((p) => p.kind === 'task' && inYear(new Date(p.startAt))).forEach((p) => {
      const k = keyOf(new Date(p.startAt));
      taskDays[k] = taskDays[k] || { date: new Date(p.startAt), left: 0 };
      if (!p.done) taskDays[k].left += 1;
    });
    const stones = items.filter((p) => p.kind === 'milestone' && inYear(new Date(p.startAt)))
      .sort((a, b) => String(a.startAt).localeCompare(String(b.startAt)));
    const tracks = items.filter((p) => p.kind === 'track' && p.endAt &&
        new Date(p.startAt) < y1 && new Date(p.endAt) >= y0)
      .sort((a, b) => String(a.startAt).localeCompare(String(b.startAt)));

    /* месяцы: цвет по сезону, сентябрь наверху, дальше по часовой */
    const monthCells = Array.from({ length: 12 }, (_, k) => {
      const m = (8 + k) % 12;
      const y = st.yearStart + (8 + k >= 12 ? 1 : 0);
      const a0 = -Math.PI / 2 + (k / 12) * TAU;
      const a1 = -Math.PI / 2 + ((k + 1) / 12) * TAU;
      const isNow = g === st.myG && m === t.getMonth();
      const [lx, ly] = pt(160, (a0 + a1) / 2);
      return '<g class="rcy-month rcy-month--' + seasonOf(m) + (isNow ? ' is-now' : '') + '">' +
        '<path class="rcy-month__area" d="' + sectorPath(136, 184, a0, a1) + '" ' +
          'onclick="SH.views.roadmap.focusMonth(' + y + ', ' + m + ')" ' +
          'aria-label="' + e(MON_NOM[m] + ' ' + y) + '"><title>' + e(MON_NOM[m] + ' ' + y) + '</title></path>' +
        '<text class="rcy-month__label" x="' + r2(lx) + '" y="' + r2(ly + 4) + '" text-anchor="middle">' +
          MON3[m] + '</text>' +
      '</g>';
    }).join('');

    /* вехи: нумерованные точки, номер совпадает с номером в списке под кругом */
    const seenA = [];
    const stoneDots = stones.map((ms, i) => {
      const d = new Date(ms.startAt);
      const a = ang(d);
      let r = 118;
      if (seenA.some((x) => Math.abs(x - a) < 0.1)) r = 109;
      seenA.push(a);
      const [x, y] = pt(r, a);
      return '<g class="rcy-stone' + (ms.done ? ' is-done' : '') + '" ' +
          'onclick="SH.views.roadmap.openItem(\'' + ms.id + '\')">' +
        '<circle cx="' + r2(x) + '" cy="' + r2(y) + '" r="9"></circle>' +
        '<text x="' + r2(x) + '" y="' + r2(y + 3.2) + '" text-anchor="middle">' + (i + 1) + '</text>' +
        '<title>' + e(ms.title + ' · ' + dayLabel(d)) + '</title>' +
      '</g>';
    }).join('');

    /* марафоны: цветная дуга на своей дорожке */
    const laneR = [96, 84, 72];
    const trackArcs = tracks.map((p, i) => {
      const a0 = ang(new Date(Math.max(new Date(p.startAt).getTime(), y0.getTime())));
      const a1 = Math.max(a0 + 0.03,
        ang(new Date(Math.min(new Date(p.endAt).getTime() + DAY, y1.getTime()))));
      const r = laneR[i % laneR.length];
      const d = arcPath(r, a0, a1);
      return '<path class="rcy-track" d="' + d + '" stroke="' + colors[p.id] + '">' +
          '<title>' + e(p.title) + '</title></path>' +
        '<path class="rcy-track__hit" d="' + d + '" ' +
          'onclick="SH.views.roadmap.openItem(\'' + p.id + '\')"><title>' + e(p.title) + '</title></path>';
    }).join('');

    /* дни с делами — мелкие точки на внутреннем крае кольца месяцев */
    const taskDots = Object.keys(taskDays).map((k) => {
      const day = taskDays[k];
      const [x, y] = pt(130, ang(day.date));
      return '<circle class="rcy-tick' + (day.left ? '' : ' is-done') + '" cx="' + r2(x) + '" cy="' + r2(y) +
        '" r="2.6" onclick="SH.views.roadmap.zoomTo(\'' + k + '\')"><title>' +
        e(day.items ? '' : '') + e(k.split('-').reverse().slice(0, 2).join(' ') +
          ' · ' + (day.left ? 'дел: ' + day.left : 'всё сделано')) + '</title></circle>';
    }).join('');

    /* сегодня: засечка на внутреннем крае кольца месяцев */
    const isThisYear = t >= y0 && t < y1;
    const aNow = isThisYear ? ang(t) : -Math.PI / 2;
    const [qx, qy] = pt(131, aNow);
    const nowDot = isThisYear
      ? '<circle class="rcy-nowdot" cx="' + r2(qx) + '" cy="' + r2(qy) + '" r="4"></circle>' : '';
    const dayNo = Math.round((t - y0) / DAY) + 1;
    const hubSub = isThisYear ? 'день ' + dayNo : (y0 > t ? 'ещё впереди' : 'прошлый год');

    const svg =
      '<svg class="rcy" viewBox="0 0 380 380" role="img" aria-label="Круг года: ' + g + ' класс">' +
        '<circle class="rcy-base" cx="190" cy="190" r="184"></circle>' +
        monthCells +
        trackArcs +
        stoneDots +
        taskDots +
        nowDot +
        '<circle class="rcy-hub" cx="190" cy="190" r="60"></circle>' +
        '<text class="rcy-hub__class" x="190" y="181" text-anchor="middle">' + g + ' класс</text>' +
        '<text class="rcy-hub__year" x="190" y="196" text-anchor="middle">' + yearLabel(st.yearStart) + '</text>' +
        '<text class="rcy-hub__sub" x="190" y="210" text-anchor="middle">' + hubSub + '</text>' +
      '</svg>';

    /* список под кругом: марафоны полоской, вехи — своим номером */
    const rows = tracks.map((p) => {
      const stat = trackStat(p);
      const meta = stat.live ? 'день ' + stat.dayIndex + ' из ' + stat.totalDays
        : stat.finished ? 'завершён · ' + stat.totalDays + ' ' + plural(stat.totalDays, 'день', 'дня', 'дней')
        : stat.totalDays + ' ' + plural(stat.totalDays, 'день', 'дня', 'дней');
      return '<button class="rcy-row" onclick="SH.views.roadmap.openItem(\'' + p.id + '\')">' +
        '<i class="rcy-row__bar" style="background:' + (colors[p.id] || trackColor(p.color)) + '"></i>' +
        '<span class="rcy-row__title">' + e(p.title) + '</span>' +
        '<span class="rcy-row__meta">' +
          e(rangeLabel(new Date(p.startAt), new Date(p.endAt)) + ' · ' + meta) + '</span>' +
      '</button>';
    }).concat(stones.map((ms, i) =>
      '<button class="rcy-row' + (ms.done ? ' is-done' : '') + '" ' +
        'onclick="SH.views.roadmap.openItem(\'' + ms.id + '\')">' +
        '<i class="rcy-row__num">' + (i + 1) + '</i>' +
        '<span class="rcy-row__title">' + e(ms.title) + '</span>' +
        '<span class="rcy-row__meta">' + e(dayLabel(new Date(ms.startAt)) + ' · ' +
          (ms.done ? 'закрыто' : countdown(ms.startAt))) + '</span>' +
      '</button>')).join('');

    const body = rows
      ? '<div class="rcy-list">' + rows + '</div>'
      : '<div class="rcy-empty">' + icon('map', 18) +
        '<span>На этот год пока пусто. Поставь веху или марафон — он сразу появится на круге.</span></div>';

    return '<div class="screen">' +
      head('Роадмап', 'Круг учебного года', iconButton('plus', 'Добавить в роадмап', 'SH.views.roadmap.addItem()')) +
      gradePicker(g, 'class', 'c') +
      modeSwitch('circle', g) +
      '<div class="rcy-wrap">' + svg + '</div>' +
      body +
      '<div class="rm-legend" style="justify-content:center;margin:-2px 0 12px">' +
        '<span><i class="rcal-key rcal-key--track"></i>марафон</span>' +
        '<span><i class="rcal-key rcal-key--date"></i>веха</span>' +
        '<span><i class="rcal-key rcal-key--task"></i>день с делами</span>' +
      '</div>' +
      '<button class="btn btn--brand btn--block rm-cta" onclick="SH.views.roadmap.addItem()">' +
        icon('plus', 18) + '<span>Поставить точку или марафон</span></button>' +
      goalsSection() +
    '</div>';
  }

  /* ─────────────────────────── КАЛЕНДАРЬ: 12 месяцев сеткой ─────────────────────────── */

  function calendarScreen(gradeArg) {
    const t = today();
    const st = gradeState(gradeArg);
    const items = store.plan();
    const colors = arcColors();

    /* отметки по дням: веха, марафон, сегодня */
    const marks = {};
    const mark = (k) => marks[k] || (marks[k] = {});
    items.forEach((p) => {
      if (p.kind === 'milestone') {
        const m = mark(keyOf(new Date(p.startAt)));
        m.stone = true;
        if (p.done) m.stoneDone = true;
      } else if (p.kind === 'task') {
        const m = mark(keyOf(new Date(p.startAt)));
        m.task = true;
      } else if (p.kind === 'track' && p.endAt) {
        const end = midnight(new Date(p.endAt));
        let d = midnight(new Date(p.startAt));
        for (let i = 0; i <= 400 && d <= end; i++, d = shift(d, 1)) {
          const m = mark(keyOf(d));
          if (!m.color) m.color = colors[p.id] || trackColor(p.color);
        }
      }
    });

    const cards = Array.from({ length: 12 }, (_, k) => {
      const m = (8 + k) % 12;
      const y = st.yearStart + (8 + k >= 12 ? 1 : 0);
      const dim = new Date(y, m + 1, 0).getDate();
      const lead = (new Date(y, m, 1).getDay() + 6) % 7;      // 0 = понедельник
      const isNowMonth = y === t.getFullYear() && m === t.getMonth();
      let cells = '';
      for (let i = 0; i < lead; i++) cells += '<span class="rcal__d is-blank"></span>';
      for (let dd = 1; dd <= dim; dd++) {
        const key = y + '-' + pad(m + 1) + '-' + pad(dd);
        const mk = marks[key] || {};
        const isToday = key === keyOf(t);
        const cls = 'rcal__d' + (isToday ? ' is-today' : mk.stone ? ' is-date' : '');
        cells += '<button class="' + cls + '" onclick="SH.views.roadmap.openDay(\'' + key + '\')" ' +
          'aria-label="' + dd + ' ' + MONTHS[m] + '">' + dd +
          (mk.color ? '<i class="rcal__bar" style="background:' + mk.color + '"></i>' : '') +
          (mk.task || mk.color ? '' : '') +
          (mk.task ? '<i class="rcal__task"></i>' : '') +
        '</button>';
      }
      return '<section class="rcal__m rcal__m--' + seasonOf(m) + (isNowMonth ? ' is-now' : '') + '" ' +
          'data-m="' + y + '-' + pad(m + 1) + '">' +
        '<button class="rcal__head" onclick="SH.views.roadmap.openMonth(' + y + ', ' + m + ')">' +
          MON_NOM[m].toUpperCase() + '</button>' +
        '<div class="rcal__wd">' + WD.map((w) => '<span>' + w[0] + '</span>').join('') + '</div>' +
        '<div class="rcal__grid">' + cells + '</div>' +
      '</section>';
    }).join('');

    return '<div class="screen">' +
      head('Роадмап', 'Календарь года', iconButton('plus', 'Добавить в роадмап', 'SH.views.roadmap.addItem()')) +
      gradePicker(st.g, 'year', 'cal') +
      modeSwitch('calendar', st.g) +
      '<div class="rcal">' + cards + '</div>' +
      '<div class="rm-legend rcal__legend">' +
        '<span><i class="rcal-key rcal-key--track"></i>марафон</span>' +
        '<span><i class="rcal-key rcal-key--date"></i>дата</span>' +
        '<span><i class="rcal-key rcal-key--task"></i>дела</span>' +
        '<span><i class="rcal-key rcal-key--today"></i>сегодня</span>' +
      '</div>' +
    '</div>';
  }

  /* ─────────────────────────── МИКРО: неделя и день ─────────────────────────── */

  function weekScreen(anyDay) {
    const anchor = anyDay || today();
    const monday = mondayOf(anchor);
    const days = Array.from({ length: 7 }, (_, i) => shift(monday, i));
    const selectedKey = keyOf(anchor);
    const items = store.plan();

    const byDay = days.map((d) => {
      const k = keyOf(d);
      const tasks = items.filter((p) => p.kind === 'task' && keyOf(new Date(p.startAt)) === k)
        .sort((a, b) => String(a.startAt).localeCompare(String(b.startAt)));
      const stones = items.filter((p) => p.kind === 'milestone' && keyOf(new Date(p.startAt)) === k);
      const tracks = items.filter((p) => p.kind === 'track' && p.endAt &&
        new Date(p.startAt) <= shift(d, 1) && new Date(p.endAt) >= d);
      return { date: d, k, tasks, stones, tracks };
    });

    const total = byDay.reduce((s, x) => s + x.tasks.length + x.stones.length, 0);
    const range = monday.getMonth() === days[6].getMonth()
      ? dayLabel(monday) + ' — ' + days[6].getDate() + ' ' + MONTHS[days[6].getMonth()]
      : dayLabel(monday) + ' — ' + dayLabel(days[6]);

    const strip = '<div class="rm-strip">' +
      days.map((d) => {
        const info = byDay.find((x) => x.k === keyOf(d));
        const count = info.tasks.length + info.stones.length;
        const isToday = sameDay(d, today());
        return '<button class="rm-strip__day' + (isToday ? ' is-today' : '') +
          (keyOf(d) === selectedKey ? ' is-sel' : '') + '" data-day="' + keyOf(d) + '" ' +
          'onclick="SH.views.roadmap.pickDay(\'' + keyOf(d) + '\')">' +
          '<span class="rm-strip__wd">' + WD[(d.getDay() + 6) % 7] + '</span>' +
          '<span class="rm-strip__num">' + d.getDate() + '</span>' +
          '<span class="rm-strip__dots">' + (count ? '<i></i>'.repeat(Math.min(3, count)) : '') + '</span>' +
        '</button>';
      }).join('') +
    '</div>';

    const dayCards = byDay.map((info) => {
      const active = info.k === selectedKey;
      const isToday = sameDay(info.date, today());
      const rows = [];

      info.stones.forEach((ms) => {
        const soon = !ms.done && daysTo(ms.startAt) >= 0 && daysTo(ms.startAt) <= 7;
        rows.push('<button class="rm-chip rm-chip--stone' + (ms.done ? ' is-done' : '') + (soon ? ' is-soon' : '') + '" ' +
          'onclick="SH.views.roadmap.openItem(\'' + ms.id + '\')">' +
          '<span class="rm-chip__ico">' + icon('flag', 13) + '</span>' +
          '<span class="grow"><span class="rm-chip__title">' + e(ms.title) + '</span>' +
          '<span class="rm-chip__sub">' + e(timeLabel(ms.startAt)) + ' · дедлайн</span></span>' +
        '</button>');
      });

      info.tracks.slice(0, 3).forEach((tr) => {
        const st = trackStat(tr);
        rows.push('<button class="rm-chip rm-chip--track rm-track--' + e(tr.color || 'sky') + '" ' +
          'onclick="SH.views.roadmap.openItem(\'' + tr.id + '\')">' +
          '<span class="rm-snake"><i style="width:' + st.pct + '%"></i></span>' +
          '<span class="rm-snake__meta"><b>' + e(tr.title) + '</b><span>День ' + st.dayIndex + ' из ' + st.totalDays + ' · ' + st.pct + '%</span></span>' +
        '</button>');
      });

      info.tasks.forEach((tk) => {
        rows.push('<button class="rm-task' + (tk.done ? ' is-done' : '') + '" ' +
          'onclick="SH.views.roadmap.toggleTask(\'' + tk.id + '\')">' +
          '<span class="rm-task__box">' + (tk.done ? icon('check', 12) : '') + '</span>' +
          '<span class="rm-task__time">' + e(timeLabel(tk.startAt)) + '</span>' +
          '<span class="rm-task__text">' + e(tk.title) + '</span>' +
          '<span class="rm-task__edit" onclick="event.stopPropagation();SH.views.roadmap.editItem(\'' + tk.id + '\')">' +
            icon('edit', 14) + '</span>' +
        '</button>');
      });

      if (!rows.length) {
        rows.push('<div class="rm-day__empty">Свободно</div>');
      }

      return '<section class="rm-day" data-day="' + info.k + '" data-active="' + (active ? '1' : '0') + '">' +
        '<div class="rm-day__head">' +
          '<span class="rm-day__wd">' + WD[(info.date.getDay() + 6) % 7] + ', ' + info.date.getDate() + ' ' + MONTHS[info.date.getMonth()] + '</span>' +
          (isToday ? '<span class="tag tag--lav">сегодня</span>' : '') +
          '<span class="grow"></span>' +
          '<button class="rm-day__add" onclick="SH.views.roadmap.addItem(\'' + info.k + '\')" aria-label="Добавить на день">' + icon('plus', 16) + '</button>' +
        '</div>' +
        '<div class="rm-day__body">' + rows.join('') + '</div>' +
      '</section>';
    }).join('');

    return '<div class="screen">' +
      head('Роадмап', 'Неделя и день', iconButton('plus', 'Добавить в роадмап', 'SH.views.roadmap.addItem(\'' + selectedKey + '\')')) +
      '<button class="rm-back" onclick="SH.app.go(\'#/roadmap/cal\')">' + icon('arrowLeft', 15) + 'К календарю</button>' +
      modeSwitch('calendar', circleGrade) +
      '<div class="rm-weekhead">' +
        '<button class="icon-btn icon-btn--plain" onclick="SH.views.roadmap.shiftWeek(-1)" aria-label="Прошлая неделя">' + icon('arrowLeft', 20) + '</button>' +
        '<button class="grow rm-weekhead__title" onclick="SH.app.go(\'#/roadmap\')">' + e(range) +
          '<span>' + (total ? total + ' ' + plural(total, 'пункт', 'пункта', 'пунктов') + ' на неделе' : 'пока пусто') + '</span>' +
        '</button>' +
        '<button class="icon-btn icon-btn--plain" onclick="SH.views.roadmap.shiftWeek(1)" aria-label="Следующая неделя">' + icon('arrowRight', 20) + '</button>' +
        '<button class="btn btn--soft btn--xs" onclick="SH.views.roadmap.goToday()">Сегодня</button>' +
      '</div>' +
      strip +
      '<div class="rm-days">' + dayCards + '</div>' +
    '</div>';
  }

  /* ─────────────────────────── цели и шаги (ИИ-план) ─────────────────────────── */

  let goalsOpen = false;
  let selectedGoalId = null;

  function goalsSection() {
    const goals = store.goals();
    if (!goals.length) {
      return '<div class="rm-goals">' +
        '<button class="rm-goals__toggle" onclick="SH.views.roadmap.toggleGoals()">' +
          '<span class="grow" style="text-align:left"><b>Цели и шаги</b><span class="muted small"> зачем всё это</span></span>' +
          icon(goalsOpen ? 'chevronRight' : 'chevronRight', 18) +
        '</button>' +
        '<div class="muted small" style="margin-top:6px">Пока целей нет — создай первую, и ИИ разложит её на шаги.</div>' +
        '<button class="btn btn--soft btn--sm mt-16" onclick="SH.views.roadmap.addGoal()">Создать цель</button>' +
      '</div>';
    }
    if (!selectedGoalId || !goals.some((g) => g.id === selectedGoalId)) selectedGoalId = goals[0].id;
    const goal = goals.find((g) => g.id === selectedGoalId);
    const tasks = store.tasks(goal.id);
    const progress = store.goalProgress(goal.id);

    return '<div class="rm-goals">' +
      '<button class="rm-goals__toggle" onclick="SH.views.roadmap.toggleGoals()">' +
        '<span class="grow" style="text-align:left"><b>Цели и шаги</b><span class="muted small"> · ' + goals.length + ' ' + plural(goals.length, 'цель', 'цели', 'целей') + '</span></span>' +
        '<span class="rm-goals__chev' + (goalsOpen ? ' is-open' : '') + '">' + icon('chevronRight', 18) + '</span>' +
      '</button>' +
      (goalsOpen
        ? '<div class="hscroll" style="margin:14px 0">' +
            goals.map((g) => {
              const active = g.id === goal.id;
              return '<button class="rm-goalchip' + (active ? ' is-active' : '') + '" onclick="SH.views.roadmap.selectGoal(\'' + g.id + '\')">' +
                '<span class="ellipsis">' + e(g.title) + '</span>' +
                '<span class="rm-goalchip__p"><i style="width:' + store.goalProgress(g.id) + '%"></i></span>' +
              '</button>';
            }).join('') +
            '<button class="chip-add" style="min-width:88px" onclick="SH.views.roadmap.addGoal()">' + icon('plus', 15) + 'Цель</button>' +
          '</div>' +
          '<div class="row" style="margin-bottom:10px">' +
            '<span class="small muted grow">' + progress + '% · ' + tasks.filter((x) => x.status === 'done').length + ' из ' + tasks.length + ' шагов</span>' +
            '<button class="section-link" onclick="SH.views.roadmap.deleteGoal(\'' + goal.id + '\')">Удалить цель</button>' +
          '</div>' +
          (tasks.length
            ? '<div class="list">' + tasks.map(goalTaskRow).join('') + '</div>'
            : '<div class="muted small">Шагов пока нет.</div>') +
          '<div class="row mt-16" style="gap:10px">' +
            '<button class="btn btn--soft grow btn--sm" onclick="SH.views.roadmap.addGoalTask()">+ Шаг</button>' +
            '<button class="btn btn--brand grow btn--sm" onclick="SH.views.roadmap.generate()">' + icon('sparkles', 16) + 'План с ИИ</button>' +
          '</div>'
        : '') +
    '</div>';
  }

  function goalTaskRow(t) {
    const done = t.status === 'done';
    return '<div class="item card--tap" onclick="SH.views.roadmap.toggleGoalTask(\'' + t.id + '\')" style="cursor:pointer">' +
      '<span style="color:' + (done ? 'var(--success)' : 'var(--muted)') + '">' + icon(done ? 'checkCircle' : 'circle', 20) + '</span>' +
      '<div class="grow" style="min-width:0"><div style="font-size:14px;' + (done ? 'text-decoration:line-through;color:var(--muted)' : '') + '">' +
        e(t.title) + '</div>' +
        (t.dateLabel ? '<div class="small muted">' + e(t.dateLabel) + '</div>' : '') +
      '</div></div>';
  }

  /* ─────────────────────────── шиты ─────────────────────────── */

  function addItemSheet(presetKey) {
    const date = presetKey && /^\d{4}-\d{2}-\d{2}$/.test(presetKey) ? presetKey : keyOf(today());
    ui.sheet({
      title: 'Что добавить',
      subtitle: 'Три масштаба: дедлайн, марафон или дело на день',
      body:
        '<div class="rm-pick">' +
          option('milestone', 'flag', 'Веха или дедлайн', 'Точная дата: экзамен, подача заявки, сдача проекта', date) +
          option('track', 'refresh', 'Марафон', 'Растянуто на недели: подготовка, стажировка, буткемп', date) +
          option('task', 'clock', 'Дело на день', 'Урок, созвон, задача на конкретное время', date) +
        '</div>'
    });
  }

  function option(kind, ico, title, sub, date) {
    return '<button class="rm-pick__row" onclick="SH.views.roadmap.formItem(\'' + kind + '\',\'' + date + '\')">' +
      '<span class="rm-pick__ico">' + icon(ico, 20) + '</span>' +
      '<span class="grow" style="text-align:left"><b>' + e(title) + '</b><span>' + e(sub) + '</span></span>' +
      icon('chevronRight', 18) +
    '</button>';
  }

  function itemForm(kind, item, dateKey) {
    const isTrack = kind === 'track';
    const base = item ? new Date(item.startAt) : (dateKey ? parseKey(dateKey) : new Date());
    const dateValue = keyOf(base);
    const timeValue = item && kind !== 'track' ? timeLabel(item.startAt) : (kind === 'task' ? '10:00' : '');
    const endValue = item && item.endAt ? keyOf(new Date(item.endAt)) : keyOf(shift(base, isTrack ? 21 : 0));

    return '' +
      ui.field('rm-title', isTrack ? 'Название марафона' : (kind === 'milestone' ? 'Что случится' : 'Что нужно сделать'),
        { value: item ? item.title : '', placeholder: isTrack ? 'Марафон подготовки к SAT' : (kind === 'milestone' ? 'Дедлайн подачи заявки' : 'Созвон с командой') }) +
      '<div class="row" style="gap:10px;margin-top:12px">' +
        '<div class="grow">' + ui.field('rm-date', isTrack ? 'Начало' : 'Дата', { type: 'date', value: dateValue }) + '</div>' +
        (kind !== 'track'
          ? '<div style="width:120px">' + ui.field('rm-time', 'Время', { type: 'time', value: timeValue }) + '</div>'
          : '<div class="grow">' + ui.field('rm-end', 'Конец', { type: 'date', value: endValue }) + '</div>') +
      '</div>' +
      ui.field('rm-note', 'Заметка', { textarea: true, value: item ? item.note || '' : '', placeholder: 'Ссылка, кабинет или что не забыть', style: 'margin-top:12px' }) +
      '<div class="wrap" style="margin-top:14px">' +
        COLORS.map((c, i) => '<button class="rm-color' + ((item ? item.color : COLORS[i % COLORS.length]) === c ? ' is-sel' : '') +
          '" data-color="' + c + '" style="background:var(--' + c + ')" onclick="SH.views.roadmap.pickColor(this)" aria-label="' + c + '"></button>').join('') +
      '</div>';
  }

  function formItem(kind, dateKey, itemId) {
    const item = itemId ? store.planItem(itemId) : null;
    ui.sheet({
      title: item ? 'Изменить' : (kind === 'track' ? 'Новый марафон' : (kind === 'milestone' ? 'Новая веха' : 'Дело на день')),
      subtitle: kind === 'track' ? 'Полоса протянется через дни и месяцы' : '',
      body:
        itemForm(kind, item, dateKey) +
        '<button class="btn btn--brand btn--block mt-16" id="rm-save" onclick="SH.views.roadmap.saveItem(\'' +
          kind + '\',\'' + (item ? item.id : '') + '\')">' + (item ? 'Сохранить' : 'Добавить') + '</button>' +
        (item ? '<button class="btn btn--danger btn--block" style="margin-top:8px" onclick="SH.views.roadmap.removeItem(\'' + item.id + '\')">Удалить</button>' : ''),
      onMount(el) {
        el.querySelectorAll('.rm-color').forEach((b) => b.addEventListener('click', () => {
          el.querySelectorAll('.rm-color').forEach((x) => x.classList.remove('is-sel'));
          b.classList.add('is-sel');
        }));
        setTimeout(() => { const i = el.querySelector('#rm-title'); if (i) i.focus(); }, 140);
      }
    });
  }

  function stoneSheet(item) {
    const d = new Date(item.startAt);
    const left = daysTo(item.startAt);
    ui.sheet({
      title: item.title,
      subtitle: dayLabel(d) + ' · ' + timeLabel(item.startAt) + ' · ' + countdown(item.startAt),
      body:
        (item.note ? '<p class="body" style="margin:0 0 16px;line-height:1.6">' + e(item.note) + '</p>' : '') +
        '<div class="rm-fact">' + icon('calendar', 16) + '<span>' +
          (item.done ? 'Отмечено как выполненное' : (left < 0 ? 'Дедлайн прошёл' : 'До дедлайна ' + left + ' ' + plural(left, 'день', 'дня', 'дней'))) +
        '</span></div>' +
        '<button class="btn ' + (item.done ? 'btn--soft' : 'btn--brand') + ' btn--block mt-16" onclick="SH.views.roadmap.toggleDone(\'' + item.id + '\')">' +
          icon('check', 17) + (item.done ? 'Вернуть в план' : 'Отметить готовым') + '</button>' +
        '<div class="row mt-16" style="gap:10px">' +
          '<button class="btn btn--soft grow" onclick="SH.views.roadmap.editItem(\'' + item.id + '\')">Изменить</button>' +
          '<button class="btn btn--danger grow" onclick="SH.views.roadmap.removeItem(\'' + item.id + '\')">Удалить</button>' +
        '</div>'
    });
  }

  function trackSheet(item) {
    const st = trackStat(item);
    const list = item.checklist || [];
    ui.sheet({
      title: item.title,
      subtitle: dayLabel(new Date(item.startAt)) + ' — ' + (item.endAt ? dayLabel(new Date(item.endAt)) : ''),
      body:
        '<div class="rm-snake rm-snake--lg rm-track--' + e(item.color || 'sky') + '">' +
          '<span class="rm-snake__bar"><i style="width:' + st.pct + '%"></i></span>' +
          '<span class="rm-snake__meta"><b>День ' + st.dayIndex + ' из ' + st.totalDays + '</b><span>' + st.pct + '% прохождения</span></span>' +
        '</div>' +
        (item.note ? '<p class="body" style="margin:14px 0 0;line-height:1.6">' + e(item.note) + '</p>' : '') +
        '<div class="section-head" style="margin-top:18px"><span class="h2" style="font-size:15px">Чек-лист по неделям</span></div>' +
        (list.length
          ? '<div class="list">' + list.map((c) =>
              '<div class="item" style="padding:10px 12px">' +
                '<button class="rm-task__box' + (c.done ? ' is-on' : '') + '" onclick="SH.views.roadmap.toggleCheck(\'' + item.id + '\',\'' + c.id + '\')" aria-label="Отметить">' +
                  (c.done ? icon('check', 12) : '') + '</button>' +
                '<span class="grow" style="font-size:14px;' + (c.done ? 'text-decoration:line-through;color:var(--muted)' : '') + '">' + e(c.text) + '</span>' +
                '<button class="rm-x" onclick="SH.views.roadmap.removeCheck(\'' + item.id + '\',\'' + c.id + '\')" aria-label="Удалить">' + icon('close', 15) + '</button>' +
              '</div>').join('') + '</div>'
          : '<div class="muted small">Разбей марафон на недели — прогресс станет точнее.</div>') +
        '<div class="row" style="gap:8px;margin-top:12px">' +
          '<div class="field grow"><input id="rm-check" placeholder="Например: Неделя 3 · пробный тест"></div>' +
          '<button class="btn btn--soft" id="rm-check-add" onclick="SH.views.roadmap.addCheck(\'' + item.id + '\')">' + icon('plus', 17) + '</button>' +
        '</div>' +
        '<div class="row mt-16" style="gap:10px">' +
          '<button class="btn btn--soft grow" onclick="SH.views.roadmap.editItem(\'' + item.id + '\')">Изменить</button>' +
          '<button class="btn btn--danger grow" onclick="SH.views.roadmap.removeItem(\'' + item.id + '\')">Удалить</button>' +
        '</div>'
    });
  }

  /* ─────────────────────────── монтирование ─────────────────────────── */

  function mount(root) {
    const cal = root.querySelector('.rcal');
    if (!cal) return;
    const fresh = calHash !== location.hash;
    calHash = location.hash;
    let target = null;
    if (calFocus) { target = cal.querySelector('[data-m="' + calFocus + '"]'); calFocus = null; }
    if (!target && fresh) target = cal.querySelector('.rcal__m.is-now');
    if (target) setTimeout(() => target.scrollIntoView({ block: 'center' }), 40);
  }

  /* ─────────────────────────── действия ─────────────────────────── */

  const actions = {
    /* навигация между масштабами */
    zoomTo(dateKey) { SH.app.go('#/roadmap/w/' + dateKey); },
    shiftWeek(delta) {
      const cur = (location.hash.split('/')[3]) || keyOf(today());
      SH.app.go('#/roadmap/w/' + keyOf(shift(parseKey(cur), delta * 7)));
    },
    goToday() { SH.app.go('#/roadmap/w/' + keyOf(today())); },
    pickDay(dateKey) { SH.app.go('#/roadmap/w/' + dateKey); },
    openMonth(year, month) {
      const first = new Date(year, month, 1);
      const target = (first <= today() && today() < new Date(year, month + 1, 1)) ? today() : first;
      SH.app.go('#/roadmap/w/' + keyOf(target));
    },
    openDay(dateKey) { SH.app.go('#/roadmap/w/' + dateKey); },

    /* тап по месяцу на круге → календарь, прокрученный к этому месяцу */
    focusMonth(year, month) {
      calFocus = year + '-' + pad(month + 1);
      const g = [9, 10, 11, 12].indexOf(circleGrade) >= 0 ? circleGrade : myGrade();
      SH.app.go('#/roadmap/cal/' + g);
    },

    pickGrade(value, route) {
      const g = parseInt(value, 10);
      if (g === 0) return;
      if ([9, 10, 11, 12].indexOf(g) < 0) return;
      circleGrade = g;
      SH.app.go('#/roadmap/' + (route === 'cal' ? 'cal' : 'c') + '/' + g);
    },

    /* создание и правка */
    addItem(presetKey) { addItemSheet(presetKey); },
    formItem,
    editItem(id) { const it = store.planItem(id); if (it) formItem(it.kind, null, id); },

    pickColor(btn) {
      btn.parentNode.querySelectorAll('.rm-color').forEach((b) => b.classList.remove('is-sel'));
      btn.classList.add('is-sel');
    },

    saveItem(kind, id) {
      // защита от двойного тапа: второй клик по кнопке не создаёт дубль
      const btn = document.getElementById('rm-save');
      if (btn && btn.disabled) return;
      if (btn) { btn.disabled = true; btn.textContent = 'Сохраняю…'; }
      const val = (k) => { const el = document.getElementById(k); return el ? el.value : ''; };
      const title = val('rm-title').trim();
      if (!title) {
        if (btn) { btn.disabled = false; btn.textContent = id ? 'Сохранить' : 'Добавить'; }
        ui.toast('Дай название');
        return;
      }
      const dateStr = val('rm-date') || keyOf(today());
      const timeStr = kind === 'track' ? '00:00' : (val('rm-time') || '09:00');
      const base = parseKey(dateStr);
      const hhmm = timeStr.split(':').map(Number);
      base.setHours(hhmm[0] || 0, hhmm[1] || 0, 0, 0);
      const endRaw = val('rm-end') || dateStr;
      const end = parseKey(endRaw);
      end.setHours(23, 59, 0, 0);
      const colorEl = document.querySelector('.rm-color.is-sel');
      const color = colorEl ? colorEl.getAttribute('data-color') : 'sky';

      const patch = {
        kind, title, note: val('rm-note').trim(),
        startAt: base.toISOString(),
        endAt: kind === 'track' ? end.toISOString() : '',
        color
      };
      if (kind === 'track' && end < base) {
        if (btn) { btn.disabled = false; btn.textContent = id ? 'Сохранить' : 'Добавить'; }
        ui.toast('Конец раньше начала');
        return;
      }

      if (id) store.updatePlanItem(id, patch);
      else store.addPlanItem(patch);

      ui.closeSheet();
      ui.toast(id ? 'Сохранено' : 'Добавлено в роадмап');
      SH.app.render();
    },

    removeItem(id) {
      ui.confirmSheet('Удалить из роадмапа?', 'Пункт исчезнет со всех дней и из обоих режимов.', 'Удалить', () => {
        store.deletePlanItem(id);
        ui.toast('Удалено');
        SH.app.render();
      });
    },

    openItem(id) {
      const item = store.planItem(id);
      if (!item) return;
      if (item.kind === 'track') trackSheet(item);
      else if (item.kind === 'milestone') stoneSheet(item);
      else formItem('task', null, id);
    },

    toggleTask(id) {
      const item = store.planItem(id);
      if (!item) return;
      store.updatePlanItem(id, { done: !item.done });
      SH.app.render();
    },

    toggleDone(id) {
      const item = store.planItem(id);
      if (!item) return;
      store.updatePlanItem(id, { done: !item.done });
      ui.closeSheet();
      ui.toast(item.done ? 'Вернули в план' : 'Отмечено готовым');
      SH.app.render();
    },

    addCheck(id) {
      const el = document.getElementById('rm-check');
      if (!el || !el.value.trim()) { ui.toast('Напиши пункт'); return; }
      store.addPlanCheck(id, el.value);
      el.value = '';
      actions.openItem(id);
      SH.app.render();
    },
    toggleCheck(itemId, checkId) {
      store.togglePlanCheck(itemId, checkId);
      actions.openItem(itemId);
      SH.app.render();
    },
    removeCheck(itemId, checkId) {
      store.removePlanCheck(itemId, checkId);
      actions.openItem(itemId);
      SH.app.render();
    },

    /* «добавить из агрегатора» — вызывается с карточки события */
    addEventToPlan(eventId) {
      const ev = store.event(eventId);
      if (!ev || !store.isAuthed) { if (!store.isAuthed) SH.app.go('#/auth'); return; }
      const already = store.plan().some((p) => p.eventId === ev.id && p.kind === 'milestone');
      const deadline = new Date(ev.deadlineDate);
      if (isNaN(deadline)) { ui.toast('У события нет даты'); return; }
      deadline.setHours(23, 59, 0, 0);

      if (already) {
        ui.sheet({
          title: 'Уже в роадмапе',
          subtitle: ev.title,
          body: '<p class="body muted" style="margin:0 0 18px">Дедлайн этой возможности уже стоит в плане.</p>' +
            '<button class="btn btn--brand btn--block" onclick="SH.ui.closeSheet();SH.app.go(\'#/roadmap/w/' + keyOf(deadline) + '\')">Открыть день</button>'
        });
        return;
      }

      ui.sheet({
        title: 'Добавить в роадмап',
        subtitle: ev.title,
        body:
          '<div class="rm-fact">' + icon('calendar', 16) + '<span>Дедлайн: ' + e(dayLabel(deadline)) + '</span></div>' +
          '<div class="rm-pick" style="margin-top:14px">' +
            '<button class="rm-pick__row" onclick="SH.views.roadmap.planFromEvent(\'' + ev.id + '\',\'stone\')">' +
              '<span class="rm-pick__ico">' + icon('flag', 20) + '</span>' +
              '<span class="grow" style="text-align:left"><b>Только дедлайн</b><span>Веха ' + e(dayLabel(deadline)) + '</span></span>' +
              icon('chevronRight', 18) +
            '</button>' +
            '<button class="rm-pick__row" onclick="SH.views.roadmap.planFromEvent(\'' + ev.id + '\',\'both\')">' +
              '<span class="rm-pick__ico">' + icon('refresh', 20) + '</span>' +

  /* ── синхронизация чатов: опрос сервера, пока экран открыт ── */
  let pollTimer = null;

    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    pollTarget = null;
  }

  function startPolling(target, every) {
    if (pollTarget === target && pollTimer) return;
    stopPolling();
    pollTarget = target;
    pollTimer = setInterval(pollTick, every);
  }

  function pollTick() {
    if (document.hidden) return;
    if (!store.isAuthed || !SH.api || !SH.api.enabled()) return;
    const hash = location.hash || '#/explore';
    if (pollTarget === 'list' && hash !== '#/chats') { stopPolling(); return; }
    if (pollTarget !== 'list' && hash !== '#/chat/' + pollTarget) { stopPolling(); return; }
    if (pollTarget === 'list') pollList(); else pollThread(pollTarget);
  }

  async function pollList() {
    try {
      const res = await SH.api.chats();
      if (res && res.ok && store.mergeChatList(res.chats)) SH.app.render();

  }

  async function pollThread(id) {
    const c = store.chat(id);
    if (!c) return;
    const msgs = Array.isArray(c.messages) ? c.messages : [];
    const lastAt = msgs.length ? msgs[msgs.length - 1].at : '';
    try {
      const res = await SH.api.chatMessages(id, lastAt);
      if (!res || !res.ok) return;
      const fresh = store.mergeMessages(id, res.messages);
      if (!fresh.length && !Array.isArray(res.messages)) return;

      // дописываем/обновляем в DOM, не перерисовывая экран: введённый текст не теряется

  function syncOpen(id) {
    const c = store.chat(id);
    const box = document.querySelector('.chat-scroll');
    if (!c || !box) return;
    const me = store.currentUser || {};
    const rows = Array.from(box.querySelectorAll('[data-msg]'));
    const have = new Set(rows.map((el) => el.getAttribute('data-msg')));

    // 1) обновляем подписи у уже показанных сообщений (ждёт отправки → пусто)
    rows.forEach((el) => {
      const id_ = el.getAttribute('data-msg');
      const m = (c.messages || []).find((x) => x.id === id_);
      if (!m) return;
      const flag = el.querySelector('.chat-flag');
      if (flag) {
        const st = m.failed ? 'fail' : (m.pending ? 'wait' : '');
        flag.className = 'chat-flag' + (st ? ' chat-flag--' + st : '');
        flag.textContent = m.failed ? 'не отправлено' : (m.pending ? 'ждёт отправки' : '');

      const textEl = el.querySelector('.chat-text');
      if (textEl && textEl.textContent !== m.text) textEl.textContent = m.text;
      const timeEl = el.querySelector('.chat-time');
      if (timeEl) {
        const want = ui.relTime(m.editedAt || m.at) + (m.editedAt ? ' · изменено' : '');
        if (timeEl.textContent !== want) timeEl.textContent = want;
      }
    });

    // 2) дописываем то, чего в DOM ещё нет
    const add = (c.messages || []).filter((m) => m && !have.has(m.id));
    if (!add.length) return;
    add.sort((a, b) => String(a.at).localeCompare(String(b.at)));
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
    const empty = box.querySelector('.empty');
    if (empty) empty.remove();
    box.insertAdjacentHTML('beforeend', add.map((m) => messageRow(c, m, me)).join(''));
    if (nearBottom || add.some((m) => m.authorId !== me.id)) box.scrollTop = box.scrollHeight;

  function readinessOf(u) {
    const skills = (u.skills || []).length;
    const interests = (u.interests || []).length;

    const profileParts = [
      !!u.name && u.name.trim().length > 2,
      !!u.grade,
      !!u.school,
      !!u.city,
      skills > 0,
      interests > 0
    ];
    const profileFilled = profileParts.filter(Boolean).length;
    const profileScore = Math.round((profileFilled / profileParts.length) * 35);

    const tasks = store.tasks();
    const done = tasks.filter((t) => t.status === 'done').length;
    const planScore = tasks.length ? Math.round((done / tasks.length) * 25) : 0;

    const saved = store.savedEvents().length;
    const savedScore = Math.round((Math.min(saved, 4) / 4) * 20);

    const posts = store.posts().filter((p) => p.authorId === u.id).length;
    const comments = store.state.posts.reduce((n, p) =>
      n + (p.comments || []).filter((c) => c.authorId === u.id).length, 0);
    const activity = Math.min(posts + comments, 5);
    const activityScore = Math.round((activity / 5) * 20);

    const total = Math.min(100, profileScore + planScore + savedScore + activityScore);

    return {
      total,
      parts: [
        { label: 'Заполненность профиля', score: profileScore, max: 35,
          hint: profileFilled + ' из ' + profileParts.length + ' пунктов' },
        { label: 'План развития', score: planScore, max: 25,
          hint: tasks.length ? done + ' из ' + tasks.length + ' шагов' : 'шагов пока нет' },
        { label: 'Сохранённые события', score: savedScore, max: 20,
          hint: saved + ' из 4' },

    };

  /* ───────────────────────── вспомогательное ───────────────────────── */

  function roleTag(role) {
    if (role === 'root') return '<span class="tag tag--lav">владелец</span>';
    if (role === 'admin') return '<span class="tag tag--sky">админ</span>';
    if (role === 'org') return '<span class="tag tag--lav">управляющий</span>';
    return '<span class="tag">ученик</span>';
  }

  async function loadData(force) {
    if (!isAdminLike()) return;
    const jobs = [];
    const load = (name, fn) => {
      if (!force && cache.loaded[name]) return;
      jobs.push(fn().then((r) => { cache[name] = r; cache.loaded[name] = true; }).catch(() => {}));
    };

    load('users', () => SH.api.adminUsers().then((r) => r.users || []));
    load('moderation', () => SH.api.adminModeration().then((r) => r.posts || []));
    load('aiKeys', () => SH.api.adminAiKeys().then((r) => { cache.envKeys = r.envKeys || 0; return r.keys || []; }));
    load('prompts', () => SH.api.adminPrompts().then((r) => r.prompts || []));
    load('audit', () => SH.api.adminAudit().then((r) => r.log || []));
    load('orgs', () => SH.api.adminOrgs().then((r) => r.orgs || []));

    await Promise.all(jobs);
  }

  /* ───────────────────────── действия ───────────────────────── */

  const actions = {
    go(sec) {
      if (section === sec) return;
      section = sec;
      query = '';
      SH.app.render();

    // вызывается роутером после каждой отрисовки: догружаем недостающее один раз
    mount() {
      mountSearch();
      mountNavScroll();
      mountRestore();
      if (adminMount.pending) return;
      const missing = ['users', 'moderation', 'aiKeys', 'prompts', 'audit', 'orgs']
        .filter((n) => !cache.loaded[n]);
      if (!missing.length) return;
      adminMount.pending = true;

        if (SH.views.admin.getSection() === section) SH.app.render();

          '<div class="field" style="margin-top:12px">' +

          const fileInput = el.querySelector('#ev-image-file');

          const paint = () => {
            const src = state.dataUrl || urlInput.value.trim() || (ev ? ev.image || '' : '');
            prev.innerHTML = src
              ? '<img class="img-preview" src="' + e(src) + '" alt="Превью">'
              : '<div class="img-preview" style="display:grid;place-items:center;color:var(--muted);font-size:12.5px">Превью появится здесь</div>';
          };

          urlInput.addEventListener('input', () => { state.dataUrl = ''; paint(); });

          fileInput.addEventListener('change', (ev2) => {
            const file = ev2.target.files[0];
            if (!file) return;
            if (file.size > 600 * 1024) {
              ui.toast('Файл больше 600 КБ — уменьшите или используйте ссылку');
              return;
            }
            const reader = new FileReader();
            reader.onload = () => {
              state.dataUrl = reader.result;
              urlInput.value = '';
              paint();
            };
            reader.readAsDataURL(file);
          });

          paint();
          el._imageState = state;
        }
      });
    },

    saveEvent(id) {
      const v = (f) => (document.getElementById(f) || {}).value || '';
      if (!v('ev-title').trim()) { ui.toast('Добавьте название'); return; }

      const sheetEl = document.querySelector('.sheet');
      const imgState = sheetEl && sheetEl._imageState ? sheetEl._imageState : { dataUrl: '' };
      const image = imgState.dataUrl || v('ev-image-url').trim();

      const payload = {
        title: v('ev-title').trim(),
        organizer: v('ev-org').trim(),
        description: v('ev-desc').trim(),
        category: v('ev-cat'),
        format: v('ev-format'),
        deadlineDate: new Date(v('ev-date') || Date.now() + 14 * 864e5).toISOString(),
        status: v('ev-status'),
        priority: Number(v('ev-priority')) || 0,
        eligibility: v('ev-elig').trim(),
        tags: v('ev-tags').split(',').map((s) => s.trim()).filter(Boolean),
        image,
        isFree: true
      };

      if (id) payload.id = id;
      store.saveEvent(payload);
      ui.closeSheet();
      ui.toast(id ? 'Событие обновлено' : 'Событие создано');
      SH.app.render();
    },

    moveEvent(id, delta) {
      const ev = store.event(id);
      if (!ev) return;
      const next = Math.max(0, (ev.priority || 0) + delta);
      store.saveEvent(Object.assign({}, ev, { priority: next }));
      SH.app.render();
    },

    removeEvent(id) {
      ui.confirmSheet('Удалить событие?', 'Оно исчезнет у всех учеников. Действие необратимо.', 'Удалить', () => {

    toggleSelect(kind) {
      selectMode[kind] = !selectMode[kind];
      picked[kind].clear();
      SH.app.render();
    },

    pick(kind, id, on) {
      if (on) picked[kind].add(id); else picked[kind].delete(id);
      SH.app.render();
    },

    pickAll(kind) {
      if (!selectMode[kind]) return;
      if (kind === 'users') {
        cache.users.filter((u) => u.role !== 'root' && u.id !== (store.currentUser || {}).id)
          .forEach((u) => picked.users.add(u.id));
      } else {
        store.state.events.forEach((ev) => picked.events.add(ev.id));
      }
      SH.app.render();
    },

    bulkDelete(kind) {
      const ids = Array.from(picked[kind]);
      if (!ids.length) return;
      const what = kind === 'users' ? 'пользователей' : 'событий';
      ui.confirmSheet('Удалить ' + ids.length + ' ' + what + '?',
        'Действие необратимо. Связанные сессии и закладки тоже исчезнут.', 'Удалить', async () => {
          try {
            const res = kind === 'users'
              ? await SH.api.adminBulkDeleteUsers(ids)
              : await SH.api.adminBulkDeleteEvents(ids);
            picked[kind].clear();
            if (kind === 'events') {
              store.state.events = store.state.events.filter((ev) => !ids.includes(ev.id));
            }
            cache.loaded.users = false;
            await loadData(true);
            ui.toast('Удалено: ' + (res.removed || ids.length));

            'OpenAI-совместимый: адрес до <span class="mono">/chat/completions</span>. ' +
            'Можно вставить <span class="mono">{key}</span> и <span class="mono">{model}</span> в ссылку — они подставятся сами.</p>' +
          '<button class="btn btn--brand btn--block mt-16" onclick="SH.views.admin.addKey()">Добавить</button>'
      });

    async addKey() {

        await loadData(true);
        SH.app.render();
        ui.toast(enabled ? 'Ключ включён' : 'Ключ отключён');
      } catch (err) { ui.toast('Ошибка: ' + err.message); }

    async testKey(id) {

        const res = await SH.api.adminTestAiKey(id);

          title: res.ok ? 'Ключ работает' : 'Ключ не ответил',

                  '<div class="small">Ошибка</div><div style="font-weight:650">' + e(res.error || 'нет ответа') + '</div></div>') +
            '<div class="field-label">Что вернул провайдер</div>' +

    deleteKey(id) {
      ui.confirmSheet('Удалить ключ?', 'Он перестанет использоваться для запросов.', 'Удалить', async () => {
        try {
          await SH.api.adminDeleteAiKey(id);
          cache.loaded.aiKeys = false;
          await loadData(true);
          SH.app.render();
        } catch (err) { ui.toast('Ошибка: ' + err.message); }
      });
    },

    /* промты */
    promptForm(key) {
      const pr = cache.prompts.find((x) => x.key === key);
      if (!pr) return;
      ui.sheet({
        title: pr.title,
        subtitle: 'Где используется: ' + pr.whereUsed,
        body:
          '<div class="field-label">Текст промта</div>' +
          '<textarea id="prompt-text" spellcheck="false" style="min-height:230px;width:100%;padding:12px 14px;' +
            'background:var(--surface);border:1.5px solid var(--border);border-radius:14px;outline:none;' +
            'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6">' +
            e(pr.template) + '</textarea>' +
          '<p class="small muted mt-12" style="margin-bottom:0">Переменные: {{goal}}, {{event}}, {{description}}, {{tags}}, ' +
            '{{grade}}, {{skills}}, {{interests}}, {{stats}}.</p>' +
          '<button class="btn btn--brand btn--block mt-16" onclick="SH.views.admin.savePrompt(\'' + key + '\')">Сохранить</button>'
      });
    },

    async savePrompt(key) {
      const el = document.getElementById('prompt-text');
      const template = el ? el.value.trim() : '';
      if (template.length < 10) { ui.toast('Слишком короткий промт'); return; }
      try {
        await SH.api.adminSavePrompt(key, template);
