        ui.toast('Промт сохранён');
        cache.loaded.prompts = false;
        await loadData(true);
        SH.app.render();
      } catch (err) { ui.toast('Ошибка: ' + err.message); }
    },

    async resetPrompt(key) {
      const pr = cache.prompts.find((x) => x.key === key);
      if (!pr || !pr.defaultTemplate) return;
      try {
        await SH.api.adminSavePrompt(key, pr.defaultTemplate);
        ui.toast('Промт сброшен к стандартному');
        cache.loaded.prompts = false;
        await loadData(true);
        SH.app.render();
      } catch (err) { ui.toast('Ошибка: ' + err.message); }
    },

    /* ИИ-сводка по данным школы */
    async digest() {
      ui.sheet({
        title: 'ИИ-сводка',
        subtitle: 'Модель смотрит на цифры платформы',
        body: '<div style="padding:8px 0 4px">' + ui.skeletonList(3) + '</div>',
        dismissible: false
      });
      const s = store.stats();
      const stats = 'учеников ' + s.students + ', админов ' + s.admins + ', событий ' + s.events +
        ', черновиков ' + s.drafts + ', публикаций ' + s.posts + ', жалоб ' + s.flagged;
      const text = await SH.ai.complete({ promptKey: 'digest', vars: { stats } });
      const lines = text ? text.split('\n').filter(Boolean) : SH.ai.digest();
      ui.closeSheet();
      ui.sheet({
        title: 'ИИ-сводка',
        subtitle: text ? 'Ответ модели' : 'Локальный расчёт',
        body: '<div class="list">' + lines.map((line) =>
          '<div class="rowline" style="align-items:flex-start"><span class="muted" style="margin-top:2px">' +
            icon('sparkles', 15) + '</span><div style="font-size:13.5px;line-height:1.5">' + e(line) + '</div></div>'
        ).join('') + '</div>' +
        '<button class="btn btn--brand btn--block mt-16" data-close>Понятно</button>'
      });
    },

    /* бэкап */
    async backup() {
      ui.toast('Готовлю файл…');
      try {
        const res = await SH.api.adminBackup();
        const payload = JSON.stringify(res.data, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const a = document.createElement('a');
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
        a.href = URL.createObjectURL(blob);
        a.download = 'student-hub-backup-' + stamp + '.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        ui.toast('Файл скачан');
      } catch (err) { ui.toast('Ошибка: ' + err.message); }
    },

    async restoreFile(file) {
      if (!file) return;
      let data;
      try {
        data = JSON.parse(await file.text());
      } catch (e) { ui.toast('Файл не читается: нужен JSON'); return; }
      const rows = data && data.tables
        ? Object.keys(data.tables).map((k) => k + ': ' + (data.tables[k] || []).length).join(', ')
        : 'неизвестно';
      ui.confirmSheet('Восстановить базу из файла?',
        'Текущие данные будут заменены. Содержимое файла — ' + rows + '.', 'Восстановить', async () => {
          try {
            const res = await SH.api.adminRestore(data);
            ui.toast('Готово: ' + Object.keys(res.restored || {}).length + ' таблиц');
            cache.loaded.users = false;
            await loadData(true);
            SH.app.render();
          } catch (err) { ui.toast('Ошибка: ' + err.message); }
        });

    seedDemo() {
      ui.confirmSheet('Наполнить тестовыми данными?',
        'В базе появятся ученики, события, публикации, чаты и роадмап на 9–12 класс. Существующие записи не изменятся.',
        'Наполнить', async () => {
          ui.toast('Заполняю…');
          try {
            const res = await SH.api.adminSeed();
            const names = {
              users: 'пользователей', events: 'событий', posts: 'публикаций', teams: 'команд',
              chats: 'чатов', messages: 'сообщений', plan_items: 'пунктов роадмапа'
            };
            const parts = Object.keys(res.added || {})
              .filter((k) => res.added[k] > 0)
              .map((k) => res.added[k] + ' ' + (names[k] || k));
            cache.loaded.users = false;
            await SH.app.resync(0);
            await loadData(true);
            ui.closeSheet();
            SH.app.render();
            ui.sheet({
              title: 'Готово',
              subtitle: parts.length ? 'Добавлено: ' + parts.join(', ') : 'Всё уже на месте',
              body: '<p class="small muted" style="margin:0 0 16px;line-height:1.55">' +
                  (parts.length
                    ? 'Данные в базе: они видны в событиях, сообществе, чатах и в роадмапе.'
                    : 'База уже наполнена — новых записей не появилось.') + '</p>' +
                '<button class="btn btn--brand btn--block" data-close>Понятно</button>'
            });
          } catch (err) { ui.toast('Ошибка: ' + err.message); }
        });
    },

    /* прочее */
    exportCsv() {
      const rows = [['Имя', 'Логин', 'Роль', 'Класс', 'Школа', 'Состояние']];
      (cache.users.length ? cache.users : store.state.users).forEach((u) => {
        rows.push([
          u.name, u.email || '', u.role, u.grade || '', u.school || '',
          u.blocked ? 'заблокирован' : 'активен'
        ]);
      });
      const csv = rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'student-hub-users.csv';
      a.click();
      ui.toast('CSV скачан');
    }
  };

  function accessRow(ico, title, sub, action) {
    return '<button class="item" style="width:100%;text-align:left" onclick="' + action + '">' +

      '<div class="small muted">' + e(sub) + '</div></div>' +

  SH.views = SH.views || {};

})(window.SH = window.SH || {});

/* ==========================================================================
   Кабинет организации (B2B): ученики, задачи и календарь портфеля.
   Доступен управляющему организации, а также админу и владельцу платформы
   (они могут открыть любую организацию: #/org/<id>).
   ========================================================================== */
(function (SH) {
  'use strict';

  const e = SH.ui.esc;
  const icon = SH.icon;
  const store = SH.store;

  const KIND = {
    external: { label: 'Внешний дедлайн', color: '#e74c3c', soft: '#fde8e6' },
    internal: { label: 'Внутренняя задача', color: '#3b82f6', soft: '#e6efff' },
    milestone: { label: 'Веха проекта', color: '#22a06b', soft: '#e3f7ec' }
  };

  let data = { org: null, manager: null, students: [], slots: [], deadlines: [], kpi: null };
  let tab = 'overview';
  let month = startOfMonth(new Date());
  let loading = false;
  let error = '';
  let loadedFor = '';

  function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function monthName() {
    const m = SH.ui.MONTHS[month.getMonth()] || '';
    return m.charAt(0).toUpperCase() + m.slice(1) + ' ' + month.getFullYear();
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDay(s) { const p = String(s || '').slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayLabel(d) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 864e5);
    if (diff === 0) return 'сегодня';
    if (diff === 1) return 'завтра';
    if (diff === -1) return 'вчера';
    return d.getDate() + ' ' + SH.ui.MONTHS[d.getMonth()].toLowerCase();
  }

  /* ─────────────────────────── данные ─────────────────────────── */

  function orgId() {
    const route = (location.hash.replace(/^#\/?/, '').split('/') || []);
    if (route[0] === 'org' && route[1]) return route[1];
    const me = store.currentUser || {};
    return me.orgId || null;
  }

  function load(force) {
    const id = orgId();
    if (!id) { data = { org: null, students: [], slots: [], deadlines: [], kpi: null }; return Promise.resolve(); }
    if (!force && loadedFor === id) return Promise.resolve();
    loading = true; error = '';
    return SH.api.orgOverview(id)
      .then((d) => {
        data = d || data;
        loadedFor = id;
      })
      .catch((err) => { error = err.message || 'Не удалось загрузить организацию'; })
      .finally(() => {
        loading = false;
        if (SH.app && store.isAuthed) SH.app.render();
      });
  }

  /* ─────────────────────────── разметка ─────────────────────────── */

  function kpiBar() {
    const k = data.kpi || { students: 0, open: 0, overdue: 0, weekDeadlines: 0 };
    const item = (value, label, tone) =>
      '<div class="kpi-card">' +
        '<div class="kpi__value' + (tone ? ' kpi__value--' + tone : '') + '">' + value + '</div>' +
        '<div class="kpi__label">' + e(label) + '</div>' +
      '</div>';
    return '<div class="kpi-row">' +
      item(k.students, 'учеников') +
      item(k.open, 'задач в работе') +
      item(k.overdue, 'просрочено', k.overdue ? 'danger' : '') +
      item(k.weekDeadlines, 'дедлайнов на неделе') +
    '</div>';
  }

  function tabs() {
    const list = [['overview', 'Обзор'], ['students', 'Ученики'], ['calendar', 'Календарь']];
    return '<div class="segmented">' + list.map(([id, label]) =>
      '<button class="segmented__item' + (tab === id ? ' is-active' : '') +
        '" onclick="SH.views.org.setTab(\'' + id + '\')">' + e(label) + '</button>'
    ).join('') + '</div>';
  }

  function slotChip(s, compact) {
    const k = KIND[s.kind] || KIND.internal;
    const student = data.students.find((u) => u.id === s.studentId);
    return '<div class="cal-item cal-item--' + e(s.kind || 'internal') + (s.done ? ' is-done' : '') + '"' +
      ' draggable="true" title="' + e(s.title) + '" ondragstart="SH.views.org.dragStart(event,\'' + s.id + '\')"' +
      ' onclick="SH.views.org.openSlot(\'' + s.id + '\')"' +
      ' style="--cal-color:' + k.color + ';--cal-soft:' + k.soft + '">' +
      '<span class="cal-item__dot"></span>' +
      '<span class="cal-item__text">' + e(s.title) + (compact || !student ? '' : ' · ' + e(student.name.split(' ')[0])) + '</span>' +
    '</div>';
  }

  function overviewTab() {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const horizon = new Date(now.getTime() + 30 * 864e5);
    const upcoming = []
      .concat((data.deadlines || []).map((d) => ({ date: d.date, title: d.title, kind: 'external', studentId: d.studentId, eventId: d.eventId })))
      .concat((data.slots || []).map((s) => ({ date: s.date, title: s.title, kind: s.kind, studentId: s.studentId, id: s.id, done: s.done })))
      .filter((x) => x.date && parseDay(x.date) >= new Date(now.getTime() - 864e5) && parseDay(x.date) <= horizon)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .slice(0, 20);

    if (!data.org) {
      return ui_empty('Организация не найдена', 'Владелец платформы ещё не привязал вас к организации.');
    }

    return (
      '<div class="panel">' +
        '<div class="panel__head"><span class="h3">Ближайшие 30 дней</span>' +
          '<button class="btn btn--soft btn--sm" onclick="SH.views.org.slotForm()">' + icon('plus', 15) + 'Задача</button></div>' +
        (upcoming.length
          ? '<div class="list-flat">' + upcoming.map((x) => {
              const k = KIND[x.kind] || KIND.internal;
              const student = data.students.find((u) => u.id === x.studentId);
              return '<div class="row-line" style="--cal-color:' + k.color + '">' +
                '<span class="row-line__mark"></span>' +
                '<span class="row-line__date">' + e(dayLabel(parseDay(x.date))) + '</span>' +
                '<span class="row-line__title' + (x.done ? ' is-done' : '') + '">' + e(x.title) + '</span>' +
                '<span class="row-line__who">' + e(student ? student.name.split(' ')[0] : (x.kind === 'external' ? 'дедлайн' : 'вся команда')) + '</span>' +
              '</div>';
            }).join('') + '</div>'
          : ui_empty('Пока пусто', 'Добавьте задачу или дождитесь дедлайнов учеников.')) +
      '</div>' +

      '<div class="panel mt-16">' +
        '<div class="panel__head"><span class="h3">Кто в зоне риска</span>' +
          '<button class="btn btn--soft btn--sm" onclick="SH.views.org.setTab(\'calendar\')">Календарь</button></div>' +
        riskList() +
      '</div>'
    );
  }

  function riskList() {
    const now = new Date();
    const rows = (data.slots || []).filter((s) => !s.done && parseDay(s.date) < now);
    if (!rows.length) return '<p class="small muted" style="margin:10px 2px">Просроченных задач нет — все в графике.</p>';
    return '<div class="list-flat">' + rows.slice(0, 12).map((s) => {
      const student = data.students.find((u) => u.id === s.studentId);
      return '<div class="row-line" style="--cal-color:' + (KIND[s.kind] || KIND.internal).color + '">' +
        '<span class="row-line__mark"></span>' +
        '<span class="row-line__date">' + e(dayLabel(parseDay(s.date))) + '</span>' +
        '<span class="row-line__title">' + e(s.title) + '</span>' +
        '<span class="row-line__who">' + e(student ? student.name.split(' ')[0] : 'команда') + '</span>' +
      '</div>';
    }).join('') + '</div>';
  }

  function studentsTab() {
    if (!data.students.length) {
      return '<div class="panel">' +
        ui_empty('В организации пока никого нет', 'Создайте первый аккаунт ученика — он сразу войдёт под этим логином.',
          '<button class="btn btn--brand" onclick="SH.views.org.studentForm()">' + icon('plus', 16) + 'Создать аккаунт</button>') +
      '</div>';
    }
    return '<div class="panel panel--flush">' +
      '<div class="panel__pad row"><span class="h3">Ученики и сотрудники</span><span class="spacer"></span>' +
        '<button class="btn btn--brand btn--sm" onclick="SH.views.org.studentForm()">' + icon('plus', 15) + 'Создать аккаунт</button></div>' +
      '<div class="table-wrap"><table class="table"><thead><tr>' +
        '<th>Кто</th><th>Роль</th><th>Класс</th><th>Задачи</th><th>Состояние</th>' +
      '</tr></thead><tbody>' +
      data.students.map((u) => {
        const mine = data.slots.filter((s) => s.studentId === u.id);
        const open = mine.filter((s) => !s.done).length;
        return '<tr>' +
          '<td><div style="display:flex;gap:10px;align-items:center">' + SH.ui.avatar(u, 32) +
            '<div><div style="font-weight:650">' + e(u.name) + '</div>' +
            '<div class="small muted mono">' + e(u.email || '—') + '</div></div></div></td>' +
          '<td>' + (u.role === 'org' ? '<span class="tag tag--lav">управляющий</span>'
            : (u.role === 'admin' ? '<span class="tag tag--lav">админ</span>' : '<span class="tag">ученик</span>')) + '</td>' +
          '<td>' + e(u.grade || '—') + '</td>' +
          '<td>' + (open ? open + ' в работе' : '—') + '</td>' +
          '<td>' + (u.blocked ? '<span class="tag tag--blush">заблокирован</span>' : '<span class="tag tag--mint">активен</span>') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div></div>';
  }

  function calendarTab() {
    const first = new Date(month.getFullYear(), month.getMonth(), 1);
    const startShift = (first.getDay() + 6) % 7; // понедельник первый
    const gridStart = new Date(first.getFullYear(), first.getMonth(), 1 - startShift);
    const cells = [];
    const today = new Date(); today.setHours(0, 0, 0, 0);

    const events = {};
    (data.deadlines || []).forEach((d) => {
      const key = String(d.date).slice(0, 10);
      (events[key] = events[key] || []).push({ kind: 'external', title: d.title, studentId: d.studentId, external: true });
    });
    (data.slots || []).forEach((s) => {
      const key = String(s.date).slice(0, 10);
      (events[key] = events[key] || []).push(s);
    });

    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const key = ymd(d);
      const list = (events[key] || []).slice(0, 3);
      const more = (events[key] || []).length - list.length;
      cells.push(
        '<div class="cal-cell' + (d.getMonth() !== month.getMonth() ? ' is-out' : '') +
          (d.getTime() === today.getTime() ? ' is-today' : '') + '"' +
          ' ondragover="event.preventDefault()" ondrop="SH.views.org.drop(event,\'' + key + '\')"' +
          ' onclick="SH.views.org.slotForm(null,\'' + key + '\')">' +
          '<div class="cal-cell__num">' + d.getDate() + '</div>' +
          list.map((x) => x.external
            ? '<div class="cal-item cal-item--external" title="' + e(x.title) + '" style="--cal-color:' + KIND.external.color + ';--cal-soft:' + KIND.external.soft + '">' +
                '<span class="cal-item__dot"></span><span class="cal-item__text">' + e(x.title) + '</span></div>'
            : slotChip(x, true)).join('') +
          (more > 0 ? '<div class="cal-more">+' + more + '</div>' : '') +
        '</div>'
      );
    }

    return (
      '<div class="panel">' +
        '<div class="cal-head">' +
          '<div class="cal-nav">' +
            '<button class="icon-btn icon-btn--plain" onclick="SH.views.org.shiftMonth(-1)" aria-label="Предыдущий месяц">' + icon('arrowLeft', 18) + '</button>' +
            '<div class="cal-title">' + monthName() + '</div>' +
            '<button class="icon-btn icon-btn--plain" onclick="SH.views.org.shiftMonth(1)" aria-label="Следующий месяц">' + icon('arrowRight', 18) + '</button>' +
          '</div>' +
          '<div class="cal-actions">' +
            '<button class="btn btn--soft btn--sm" onclick="SH.views.org.todayMonth()">Сегодня</button>' +
            '<button class="btn btn--brand btn--sm" onclick="SH.views.org.slotForm()">' + icon('plus', 15) + 'Задача</button>' +
          '</div>' +
        '</div>' +
        '<div class="cal-legend">' +
          ['external', 'internal', 'milestone'].map((k) =>
            '<span class="cal-legend__item"><i style="background:' + KIND[k].color + '"></i>' + KIND[k].label + '</span>').join('') +
          '<span class="cal-legend__hint">перетащите задачу на другой день, чтобы перенести дедлайн</span>' +
        '</div>' +
        '<div class="cal-grid cal-grid--head">' +
          ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((d) => '<div class="cal-dow">' + d + '</div>').join('') +
        '</div>' +
        '<div class="cal-grid">' + cells.join('') + '</div>' +
      '</div>'
    );
  }

  function ui_empty(title, text, action) {
    return '<div class="empty" style="padding:28px 12px">' +
      '<div class="empty__icon">' + icon('grid') + '</div>' +
      '<h3>' + e(title) + '</h3><p>' + e(text) + '</p>' +
      (action ? '<div class="mt-16">' + action + '</div>' : '') +
    '</div>';
  }

  function html() {
    const me = store.currentUser || {};
    const isStaff = me.role === 'admin' || me.role === 'root';
    const org = data.org;
    const title = org ? org.name : (isStaff ? 'Организации' : 'Моя организация');

    return '<div class="screen screen--org">' +
      '<div class="screen-head">' +
        '<div class="grow">' +
          '<h1 class="screen-title">' + e(title) + '</h1>' +
          '<p class="screen-sub">' +
            (org
              ? (org.plan === 'school' ? 'Школа' : 'Агентство') +
                (org.city ? ' · ' + e(org.city) : '') +
                (org.managerName ? ' · управляющий ' + e(org.managerName) : '')
              : 'B2B-кабинет: ученики, задачи и дедлайны в одном календаре') +
          '</p>' +
        '</div>' +
        (isStaff
          ? '<button class="btn btn--soft btn--sm" onclick="SH.app.go(\'#/admin\')">В админку</button>'
          : '') +
      '</div>' +

      (error ? '<div class="alert alert--danger">' + e(error) + '</div>' : '') +
      (loading && !org ? '<div class="panel">' + SH.ui.skeletonList(3) + '</div>' : '')

      + (org ? kpiBar() + tabs() : '')

      + (org
          ? (tab === 'students' ? studentsTab() : tab === 'calendar' ? calendarTab() : overviewTab())
          : (loading ? '' : noOrgBlock(isStaff)))

      + '<div style="height:24px"></div>' +
    '</div>';
  }

  function noOrgBlock(isStaff) {
    if (isStaff) {
      return '<div class="panel">' + ui_empty('Организаций пока нет',
        'Создайте первую организацию в админке — раздел «Организации».',
        '<button class="btn btn--brand" onclick="SH.app.go(\'#/admin\')">Открыть админку</button>') + '</div>';
    }
    return '<div class="panel">' + ui_empty('Нет привязки к организации',
      'Напишите администратору платформы: он добавит вас в организацию — и здесь появятся ученики.') + '</div>';
  }

  /* ─────────────────────────── действия ─────────────────────────── */

  const actions = {
    setTab(next) { tab = next; SH.app.render(); },
    shiftMonth(delta) {
      month = new Date(month.getFullYear(), month.getMonth() + delta, 1);
      SH.app.render();
    },
    todayMonth() { month = startOfMonth(new Date()); SH.app.render(); },

    dragStart(ev, id) {
      try {
        ev.dataTransfer.setData('text/plain', id);
        ev.dataTransfer.effectAllowed = 'move';
      } catch (err) { /* старый браузер */ }
    },

    drop(ev, date) {
      ev.preventDefault();
      let id = '';
      try { id = ev.dataTransfer.getData('text/plain'); } catch (err) { /* ignore */ }
      if (!id) return;
      const slot = (data.slots || []).find((s) => s.id === id);
      if (!slot) return;
      if (String(slot.date).slice(0, 10) === date) return;
      const prev = slot.date;
      slot.date = date + 'T09:00:00.000Z';
      SH.app.render();
      SH.api.orgUpdateSlot(id, { date: slot.date })
        .then(() => SH.ui.toast('Перенесено на ' + dayLabel(parseDay(date))))
        .catch((err) => {
          slot.date = prev;
          SH.app.render();
          SH.ui.toast('Не удалось перенести: ' + (err.message || 'ошибка'));
        });
    },

    openSlot(id) {
      const slot = (data.slots || []).find((s) => s.id === id);
      if (!slot) return;
      const students = data.students.map((u) => ({ value: u.id, label: u.name }));
      SH.ui.sheet({
        title: slot.title,
        subtitle: dayLabel(parseDay(slot.date)) + ' · ' + (KIND[slot.kind] || KIND.internal).label,
        body:
          '<p class="small muted" style="margin:0 0 14px">' + (slot.note ? e(slot.note) : 'Без описания') + '</p>' +
          '<div class="row" style="gap:10px;flex-wrap:wrap">' +
            '<button class="btn btn--soft btn--sm" id="slot-toggle">' + (slot.done ? 'Вернуть в работу' : 'Отметить готово') + '</button>' +
            '<button class="btn btn--soft btn--sm" id="slot-edit">Изменить</button>' +
            '<button class="btn btn--danger btn--sm" id="slot-del">Удалить</button>' +
          '</div>' +
          (students.length ? '' : ''),
        onMount(el, destroy) {
          el.querySelector('#slot-toggle').addEventListener('click', () => {
            const next = !slot.done;
            slot.done = next;
            destroy(); SH.app.render();
            SH.api.orgUpdateSlot(id, { done: next })
              .then(() => SH.ui.toast(next ? 'Задача закрыта' : 'Задача снова в работе'))
              .catch((err) => SH.ui.toast('Ошибка: ' + err.message));
          });
          el.querySelector('#slot-edit').addEventListener('click', () => { destroy(); actions.slotForm(slot); });
          el.querySelector('#slot-del').addEventListener('click', () => {
            destroy();
            SH.ui.confirmSheet('Удалить задачу?', slot.title, 'Удалить', () => {
              data.slots = data.slots.filter((s) => s.id !== id);
              SH.app.render();
              SH.api.orgDeleteSlot(id)
                .then(() => SH.ui.toast('Задача удалена'))
                .catch((err) => SH.ui.toast('Ошибка: ' + err.message));
            });
          });
        }
      });
    },

    slotForm(slot, presetDate) {
      if (!data.org) return;
      const students = [{ value: '', label: 'Вся организация' }]
        .concat(data.students.map((u) => ({ value: u.id, label: u.name })));
      const date = presetDate || (slot ? String(slot.date).slice(0, 10) : ymd(new Date()));
      SH.ui.sheet({
        title: slot ? 'Изменить задачу' : 'Новая задача',
        subtitle: 'Задача появится в календаре организации',
        body:
          SH.ui.field('slot-title', 'Что сделать', { value: slot ? slot.title : '', placeholder: 'Например: черновик эссе по Гарварду' }) +
          SH.ui.field('slot-date', 'Дата', { type: 'date', value: date }) +
          SH.ui.select('slot-kind', 'Тип', Object.keys(KIND).map((k) => ({ value: k, label: KIND[k].label })), slot ? slot.kind : 'internal') +
          SH.ui.select('slot-student', 'Кому', students, slot && slot.studentId ? slot.studentId : '') +
          SH.ui.field('slot-note', 'Заметка', { value: slot && slot.note ? slot.note : '', textarea: true, placeholder: 'Необязательно' }) +
          '<button class="btn btn--brand btn--block" id="slot-save" style="margin-top:6px">' +
            (slot ? 'Сохранить' : 'Добавить в календарь') + '</button>',
        onMount(el, destroy) {
          el.querySelector('#slot-save').addEventListener('click', () => {
            const title = el.querySelector('#slot-title').value.trim();
            const dateVal = el.querySelector('#slot-date').value;
            if (title.length < 2) return SH.ui.toast('Название слишком короткое');
            if (!dateVal) return SH.ui.toast('Выберите дату');
            const payload = {
              title: title,
              date: dateVal + 'T09:00:00.000Z',
              kind: el.querySelector('#slot-kind').value,
              studentId: el.querySelector('#slot-student').value || null,
              note: el.querySelector('#slot-note').value.trim()
            };
            destroy();
            const done = () => { SH.ui.toast(slot ? 'Задача обновлена' : 'Задача добавлена'); load(true); };
            if (slot) SH.api.orgUpdateSlot(slot.id, payload).then(done).catch((err) => SH.ui.toast('Ошибка: ' + err.message));
            else SH.api.orgCreateSlot(payload).then(done).catch((err) => SH.ui.toast('Ошибка: ' + err.message));
          });
        }
      });
    },

    studentForm() {
      if (!data.org) return;
      SH.ui.sheet({
        title: 'Новый аккаунт ученика',
        subtitle: data.org.name,
        body:
          SH.ui.field('new-name', 'Имя и фамилия', { placeholder: 'Азиз Рахимов' }) +
          SH.ui.field('new-login', 'Логин', { placeholder: 'aziz@school.ru', autocomplete: 'off' }) +
          SH.ui.field('new-pass', 'Пароль', { placeholder: 'оставьте пустым — сгенерируем', autocomplete: 'off' }) +
          SH.ui.field('new-grade', 'Класс', { placeholder: '10 класс' }) +
          '<button class="btn btn--brand btn--block" id="new-save" style="margin-top:6px">Создать аккаунт</button>',
        onMount(el, destroy) {
          el.querySelector('#new-save').addEventListener('click', () => {
            const name = el.querySelector('#new-name').value.trim();
            const login = el.querySelector('#new-login').value.trim().toLowerCase();
            if (name.length < 2) return SH.ui.toast('Укажите имя');
            if (login.length < 3) return SH.ui.toast('Логин минимум 3 символа');
            const payload = {
              name, login,
              password: el.querySelector('#new-pass').value.trim(),
              grade: el.querySelector('#new-grade').value.trim()
            };
            destroy();
            SH.api.orgCreateUser(payload)
              .then((res) => {
                SH.ui.sheet({
                  title: 'Аккаунт создан',
                  subtitle: 'Передайте ученику логин и пароль',
                  body:
                    '<div class="cred-box"><div class="cred-box__row"><span>Логин</span><b>' + e(res.login) + '</b></div>' +
                    '<div class="cred-box__row"><span>Пароль</span><b>' + e(res.password) + '</b></div></div>' +
                    '<p class="small muted" style="margin:12px 0 0">Пароль показывается один раз — сохраните его.</p>' +
                    '<button class="btn btn--soft btn--block" data-close style="margin-top:14px">Готово</button>'
                });
                load(true);
              })
              .catch((err) => SH.ui.toast('Ошибка: ' + err.message));
          });
        }
      });
    },

    reload() { load(true); }
  };

  function mount() {
    load();
  }

  SH.views = SH.views || {};
  SH.views.org = Object.assign({ html, mount }, actions);
})(window.SH = window.SH || {});

/* Установка PWA — та самая «инструкция в 3 шага» */

/* Роутер и оболочка приложения */
(function (SH) {
  'use strict';
  const { ui, store, icon } = SH;

  /* ─────────────────────────── установка PWA ─────────────────────────── */

  const install = {
    promptEvent: null,
    isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true;
    },
    async prompt() {
      if (!this.promptEvent) {
        ui.toast('Открой меню браузера → «Установить приложение»');
        return;
      }
      this.promptEvent.prompt();
      const choice = await this.promptEvent.userChoice;
      this.promptEvent = null;
      if (choice.outcome === 'accepted') {
        ui.toast('Готово! Иконка на главном экране');
        SH.app.render();
      }
    },
    init() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        this.promptEvent = e;
        if (location.hash === '#/install') SH.app.render();
      });
      window.addEventListener('appinstalled', () => {
        this.promptEvent = null;
        ui.toast('Student Hub установлен ✓');
        SH.app.render();
      });
    }
  };

  /* ─────────────────────────── роутер ─────────────────────────── */

  const STUDENT_TABS = [
    ['explore', 'explore', 'Explore'],
    ['community', 'groups', 'Сообщество'],
    ['roadmap', 'map', 'Роадмап'],
    ['chats', 'chat', 'Чаты'],
    ['profile', 'person', 'Профиль']
  ];

  const ORG_TABS = [
    ['org', 'grid', 'Организация'],
    ['community', 'groups', 'Сообщество'],
    ['chats', 'chat', 'Чаты'],
    ['profile', 'person', 'Профиль']
  ];

  function tabsList() {
    const me = store.currentUser || {};
    return me.role === 'org' ? ORG_TABS : STUDENT_TABS;
  }

  const TABS = STUDENT_TABS.slice();

  function parse() {
    const raw = location.hash.replace(/^#\/?/, '');
    const parts = raw.split('/').filter(Boolean);
    if (!parts.length) return { name: 'explore', params: [] };
    return { name: parts[0], params: parts.slice(1) };
  }

  function isTab(name) { return tabsList().some(([id]) => id === name); }

  /* какой пункт меню подсветить на «вложенном» экране */
  function tabFor(route) {
    if (isTab(route.name)) return route.name;
    if (route.name === 'event' || route.name === 'all') return 'explore';
    if (route.name === 'org') return 'org';
    if (route.name === 'user') return 'profile';
    if (route.name === 'chat') return 'chats';
    return '';
  }

  function screenFor(route) {
    const [p1, p2] = route.params;
    switch (route.name) {
      case 'explore': return { html: SH.views.explore.html(), mount: SH.views.explore.mount };
      case 'event': return { html: SH.views.explore.detail(p1), mount: (root) => SH.views.explore.mountDetail(root, p1) };
      case 'all': return { html: SH.views.explore.all(p1) };
      case 'community': return { html: SH.views.community.html() };
      case 'roadmap': return { html: SH.views.roadmap.html(p1, p2), mount: (root) => SH.views.roadmap.mount(root) };
      case 'chats': return { html: SH.views.chats.html(), mount: () => SH.views.chats.mountList() };
      case 'chat': return { html: SH.views.chats.thread(p1), mount: (root) => SH.views.chats.mountThread(root, p1) };
      case 'profile': return { html: SH.views.profile.html() };
      case 'auth': return { html: SH.views.profile.auth(p1 === 'register' ? 'register' : 'login') };
      case 'install': return { html: SH.views.install.html() };
      case 'user': return { html: SH.views.profile.user(p1) };
      case 'admin': return { html: SH.views.admin.html(), wide: true, mount: () => SH.views.admin.mount() };
      case 'org': return { html: SH.views.org.html(), mount: () => SH.views.org.mount() };
      default: return { html: SH.views.explore.html(), mount: SH.views.explore.mount };
    }
  }

  let lastRouteKey = null;

  /* Меняем hash без «прыжка»: history.replaceState не вызывает hashchange,
     поэтому стартовый экран рисуется один раз, а не двумя кадрами подряд. */
  function setHash(hash) {
    if (location.hash === hash) return;
    try { history.replaceState(null, '', hash); }
    catch (e) { location.replace(hash); }
  }

  /* экраны, доступные без входа */
  const PUBLIC = ['auth', 'install'];

  function render() {
    let route = parse();

    // гард: без сессии — только вход и экран установки
    if (!store.isAuthed && PUBLIC.indexOf(route.name) === -1) {
      setHash('#/auth');
      route = { name: 'auth', params: [] };
    }

    // авторизованному на экране входа делать нечего
    if (store.isAuthed && route.name === 'auth') {
      const target = store.isOrgManager ? '#/org' : '#/explore';
      setHash(target);
      route = { name: target.slice(2), params: [] };
    }

    const key = location.hash || '#/explore';
    const root = document.getElementById('root');
    const view = screenFor(route);
    // анимация входа — только на смене маршрута, а не на каждую перерисовку
    const routeChanged = key !== lastRouteKey;
    lastRouteKey = key;

    // на десктопе меню слева есть на всех экранах; на мобильном —
    // на вложенных страницах его заменяет кнопка «назад»
    const activeTab = tabFor(route);
    const aux = !isTab(route.name);
    // в админке своя навигация — общее меню там не нужно
    const tabbar = (route.name === 'admin' || route.name === 'auth')
      ? ''
      : buildTabbar(activeTab, aux);

    // запоминаем позицию прокрутки: фоновое обновление данных не должно
    // выбрасывать пользователя в начало экрана
    const prevScreen = root.querySelector('.screen');
    const prevScroll = prevScreen ? prevScreen.scrollTop : 0;

    root.innerHTML =
      (view.wide ? '' : '<div class="app' + (route.name === 'chat' ? ' app--chat' : '') + '">') +
      view.html +
      tabbar +
      (view.wide ? '' : '</div>');

    if (routeChanged) {
      const screen = root.querySelector('.screen');
      if (screen) screen.classList.add('screen--enter');
      if (tabbar) {
        const bar = root.querySelector('.tabbar');
        if (bar) bar.classList.add('tabbar--enter');
      }
    }

    if (view.mount) {
      try { view.mount(root); } catch (err) { console.warn('mount error', err); }
    }

    if (routeChanged) {
      // уходя с экрана, закрываем клавиатуру — иначе поле ввода остаётся
      // активным, а вернувшийся экран оказывается сдвинутым
      const active = document.activeElement;
      if (active && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) active.blur();
      // на десктопе скроллится колонка контента, на мобильном — окно
      const scroller = root.querySelector('.screen');
      if (scroller) scroller.scrollTop = 0;
      window.scrollTo(0, 0);
      if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
      if (history.scrollRestoration) history.scrollRestoration = 'manual';
    } else if (prevScroll) {
      const scroller = root.querySelector('.screen');
      if (scroller) scroller.scrollTop = prevScroll;
    }
    document.title = pageTitle(route);
  }

  function pageTitle(route) {
    const names = {
      explore: 'Explore', event: 'Событие', community: 'Сообщество',
      roadmap: 'Роадмап', chats: 'Чаты', chat: 'Чат', profile: 'Профиль',
      auth: 'Вход', install: 'Установка', admin: 'Админ-панель', all: 'События', user: 'Профиль',
      org: 'Организация'
    };
    return 'Student Hub — ' + (names[route.name] || 'Главная');
  }

  function buildTabbar(active, aux) {
    const unread = store.unreadTotal();
    const list = tabsList();
    return '<nav class="tabbar' + (aux ? ' tabbar--aux' : '') + '" role="tablist" style="--tabs:' + list.length + '">' +
      list.map(([id, ico, label]) =>
        '<button class="tab" role="tab" aria-selected="' + (id === active) + '" onclick="SH.app.go(\'#/' + id + '\')">' +
          icon(ico) +
          (id === 'chats' && unread ? '<span class="dot-badge"></span>' : '') +
          '<span>' + label + '</span>' +
        '</button>'
      ).join('') +
    '</nav>';
  }

  /* Пересинхронизация с облаком без перезагрузки страницы:
     после возврата связи и при возврате приложения на передний план. */
  let lastResync = 0;

  async function resync(minGap) {
    if (!store.isAuthed || !SH.api || !SH.api.enabled()) return false;
    const gap = typeof minGap === 'number' ? minGap : 15000;
    if (Date.now() - lastResync < gap) return false;
    lastResync = Date.now();

    // Очередь досылаем ВСЕГДА и до всяких «занят ли пользователь»:
    // печатающий человек не должен из-за этого терять исходящие сообщения.
    if (SH.api.outbox && SH.api.outbox().length) SH.api.flush().catch(() => {});

    // Перерисовку бережём: пока в фокусе поле ввода или открыт лист,
    // данные обновляем молча, иначе введённый текст и позиция курсора умрут.
    const focused = document.activeElement;
    const busy = (focused && /^(INPUT|TEXTAREA)$/.test(focused.tagName)) || !!document.querySelector('.sheet, .modal');

    const snapshot = await SH.api.bootstrap();
    if (!snapshot) return false;
    store.hydrate(snapshot, busy);
    // при «тихой» синхронизации DOM не перерисовываем, но открытый тред дополняем
    if (busy && location.hash.indexOf('#/chat/') === 0 && SH.views.chats && SH.views.chats.syncOpen) {
      SH.views.chats.syncOpen(location.hash.split('/')[2]);
    }
    return true;
  }

  const app = {
    resync,
    go(hash) {
      if (location.hash === hash) { render(); return; }
      location.hash = hash;
    },
    back() {
      if (history.length > 1) history.back();
      else app.go('#/explore');
    },
    render
  };

  /* ─────────────────────────── старт ─────────────────────────── */

  function boot() {
    store.init();
    install.init();

    // сервер сказал 401 при живом токене → сессия истекла, честно уводим на вход
    if (SH.api) {
      SH.api.onAuthLost = () => {
        if (!store.isAuthed) return;
        store.forceLogout('Сессия истекла — войди заново');
      };
    }

    /* Клавиатура на телефоне: пишем в --vvh реальную высоту видимой области.
       Тогда экран чата не уезжает под клавиатуру и над полем ввода нет пустоты. */
    function trackKeyboard() {
      const vv = window.visualViewport;
      const root = document.documentElement;
      const apply = () => {
        const h = vv ? Math.round(vv.height) : window.innerHeight;
        root.style.setProperty('--vvh', h + 'px');
        const kb = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
        root.classList.toggle('kb-open', kb > 120);
        // открытый чат должен остаться приклеенным к последнему сообщению
        document.dispatchEvent(new CustomEvent('sh:viewport', { detail: { height: h, keyboard: kb > 120 } }));
      };
      apply();
      if (vv) {
        vv.addEventListener('resize', apply);
        vv.addEventListener('scroll', apply);
      }
      window.addEventListener('orientationchange', () => setTimeout(apply, 120));
      window.addEventListener('resize', apply);
    }
    trackKeyboard();

    // приложению в отдельном окне нужен свой app-shell (см. styles.css)
    function markStandalone() {
      document.documentElement.classList.toggle('pwa-standalone', install.isStandalone());
    }
    markStandalone();
    if (window.matchMedia) {
      try { window.matchMedia('(display-mode: standalone)').addEventListener('change', markStandalone); } catch (e) {}
    }

    store.on(() => render());

    window.addEventListener('hashchange', render);

    // тема «как в системе» должна реагировать на смену настроек ОС
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (store.state.settings.theme === 'system') SH.applyTheme('system');
      });
    }

    // связь: показываем состояние и сами подтягиваем данные, когда сеть вернулась
    window.addEventListener('offline', () => ui.toast('Нет интернета — работаем из кэша'));
    window.addEventListener('online', () => {
      ui.toast('Снова онлайн');
      resync(3000);
    });

    // телефон вернулся в приложение из фона — обновляем данные, если давно не синхронизировались
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resync(45000);
    });

    // пока приложение открыто, раз в минуту проверяем, не появилось ли нового
    setInterval(() => { if (!document.hidden) resync(90000); }, 60000);

    if (!location.hash) setHash('#/explore');
    render();

    // сессия по сохранённому токену + данные из D1
    if (SH.api && SH.api.enabled()) {
      store.restoreSession().then((restored) => {
        if (restored) render();
        // без сессии данные не запрашиваем: база закрыта токеном
        if (!store.isAuthed) return null;
        return SH.api.bootstrap();
      }).then((snapshot) => {
        if (snapshot && store.hydrate(snapshot)) render();
      }).catch(() => {});
    }

    // service worker: офлайн + автообновление приложения
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js');
          const hadController = !!navigator.serviceWorker.controller;
          let reloading = false;

          // новый воркер занял место старого → перезагружаем приложение один раз,
          // но не выдёргиваем экран из-под пальцев: ждём, пока пользователь не печатает
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController || reloading) return;
            const attempt = () => {
              const f = document.activeElement;
              const busy = (f && /^(INPUT|TEXTAREA)$/.test(f.tagName)) ||
                document.querySelector('.sheet, .modal');
              if (busy) { setTimeout(attempt, 15000); return; }
              reloading = true;
              location.reload();
            };
            attempt();
          });

          // проверяем обновление при запуске и при возврате в приложение
          if (hadController) reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden) reg.update().catch(() => {});
          });
        } catch (err) {
          console.warn('SW не зарегистрирован:', err.message);
        }
      });
    }
  }

  SH.app = app;
  SH.install = install;
  document.addEventListener('DOMContentLoaded', boot);
})(window.SH = window.SH || {});

/* ── адрес бэкенда (меняется при сборке) ── */
SH.api.configure('https://kk-test-project-s4ewq.warfacewtat.workers.dev');
if (SH.ai) SH.ai.endpoint = 'https://kk-test-project-s4ewq.warfacewtat.workers.dev/ai';

</script>
