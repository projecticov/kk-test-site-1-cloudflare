    if (!c || !box) return;
    const me = store.currentUser || {};
    const rows = Array.from(box.querySelectorAll('[data-msg]'));
    const have = new Set(rows.map((el) => el.getAttribute('data-msg')));

    // 1) обновляем подписи у уже показанных сообщений (ждёт отправки → пусто)
    rows.forEach((el) => {
      const id_ = el.getAttribute('data-msg');
      const m = (c.messages || []).find((x) => x.id === id_);
      if (!m) return;
      const flag = el.querySelector('.chat-flag');
      if (flag) {
        const st = m.failed ? 'fail' : (m.pending ? 'wait' : '');
        flag.className = 'chat-flag' + (st ? ' chat-flag--' + st : '');
        flag.textContent = m.failed ? 'не отправлено' : (m.pending ? 'ждёт отправки' : '');
      }
      const textEl = el.querySelector('.chat-text');
      if (textEl && textEl.textContent !== m.text) textEl.textContent = m.text;
      const timeEl = el.querySelector('.chat-time');
      if (timeEl) {
        const want = ui.relTime(m.editedAt || m.at) + (m.editedAt ? ' · изменено' : '');
        if (timeEl.textContent !== want) timeEl.textContent = want;

    });

    // 2) дописываем то, чего в DOM ещё нет
    const add = (c.messages || []).filter((m) => m && !have.has(m.id));

/* Профиль, чужой профиль, настройки, вход/регистрация */
(function (SH) {
  'use strict';
  const { ui, store, icon } = SH;
  const e = ui.esc;

  /* ─────────────────── готовность: считается из данных ─────────────────── */

  function readinessOf(u) {
    const skills = (u.skills || []).length;
    const interests = (u.interests || []).length;

    const profileParts = [
      !!u.name && u.name.trim().length > 2,
      !!u.grade,
      !!u.school,
      !!u.city,
      skills > 0,
      interests > 0
    ];
    const profileFilled = profileParts.filter(Boolean).length;
    const profileScore = Math.round((profileFilled / profileParts.length) * 35);

    const tasks = store.tasks();
    const done = tasks.filter((t) => t.status === 'done').length;
    const planScore = tasks.length ? Math.round((done / tasks.length) * 25) : 0;

    const saved = store.savedEvents().length;
    const savedScore = Math.round((Math.min(saved, 4) / 4) * 20);

    const posts = store.posts().filter((p) => p.authorId === u.id).length;
    const comments = store.state.posts.reduce((n, p) =>
      n + (p.comments || []).filter((c) => c.authorId === u.id).length, 0);
    const activity = Math.min(posts + comments, 5);
    const activityScore = Math.round((activity / 5) * 20);

    const total = Math.min(100, profileScore + planScore + savedScore + activityScore);

    return {
      total,
      parts: [
        { label: 'Заполненность профиля', score: profileScore, max: 35,
          hint: profileFilled + ' из ' + profileParts.length + ' пунктов' },
        { label: 'План развития', score: planScore, max: 25,
          hint: tasks.length ? done + ' из ' + tasks.length + ' шагов' : 'шагов пока нет' },
        { label: 'Сохранённые события', score: savedScore, max: 20,
          hint: saved + ' из 4' },
        { label: 'Активность в сообществе', score: activityScore, max: 20,
          hint: activity + ' из 5 действий' }
      ]
    };
  }

  /* ─────────────────────────── свой профиль ─────────────────────────── */

  /* состояние связи с сервером: видно всегда, а не только когда всё сломалось */
  function syncCard() {
    if (!SH.api || !SH.api.enabled()) return '';
    const st = SH.api.status;
    const pending = SH.api.pending ? SH.api.pending() : 0;
    const last = SH.api.lastSync ? ui.relTime(new Date(SH.api.lastSync).toISOString()) : '';
    const label = st === 'online' ? 'Соединено' : (st === 'offline' ? 'Локальный режим' : 'Проверяю связь');
    return '<div class="card" style="padding:14px;margin:18px 0">' +
      '<div class="row"><span class="grow" style="font-weight:650;font-size:14px">Синхронизация</span>' +
        '<span class="tag ' + (st === 'online' ? 'tag--mint' : 'tag--sun') + '">' + label + '</span></div>' +
      '<div class="small muted" style="margin-top:6px;line-height:1.5">' +
        (st === 'online'
          ? 'Данные из базы' + (last ? ' · обновлено ' + last : '')
          : 'Изменения копятся на этом устройстве и уедут, когда связь вернётся') +
        (pending ? ' · в очереди: ' + pending : '') +
        (st !== 'online' && SH.api.lastError ? '<br>' + e(SH.api.lastError) : '') +
      '</div>' +
      '<button class="btn btn--soft btn--sm" style="margin-top:10px" onclick="SH.views.profile.checkSync()">Проверить связь</button>' +
    '</div>';
  }

  async function checkSync() {
    ui.toast('Проверяю связь…');
    const ok = await SH.app.resync(0);
    ui.toast(ok ? 'Связь есть — данные обновлены'
               : 'Нет связи: ' + ((SH.api && SH.api.lastError) || 'сервер не ответил'));
    SH.app.render();
  }

  function html() {
    if (!store.isAuthed) {
      return (
        '<div class="screen">' +
          '<div class="screen-head"><h1 class="screen-title">Профиль</h1></div>' +
          ui.empty('person', 'Собери свой профиль', 'Навыки, интересы и портфолио — всё в одном месте, и подбор работает точнее.',
            '<button class="btn btn--brand" onclick="SH.app.go(\'#/auth\')">Войти или зарегистрироваться</button>') +
        '</div>'
      );
    }

    const u = store.currentUser;
    const saved = store.savedEvents();
    const r = readinessOf(u);

    return (
      '<div class="screen">' +
        '<div class="screen-head">' +
          '<h1 class="screen-title grow">Профиль</h1>' +
          '<button class="icon-btn icon-btn--plain" onclick="SH.views.profile.settings()" aria-label="Настройки">' +
            icon('settings', 21) + '</button>' +
        '</div>' +

        (store.hasAdminBackup()
          ? '<div class="ai-note" style="margin-bottom:16px">' + icon('shield') +
              '<div class="grow"><b>Открыт аккаунт ученика.</b><br>' +
                'Это режим поддержки — вы вошли сюда из админки.' +
                '<div style="margin-top:8px"><button class="btn btn--soft btn--sm" ' +
                  'onclick="SH.views.profile.backToAdmin()">Вернуться в админку</button></div>' +
              '</div></div>'
          : '') +

        '<div class="row" style="gap:14px;margin-bottom:18px">' +
          ui.avatar(u, 56) +
          '<div class="grow" style="min-width:0">' +
            '<div class="h2" style="font-size:19px">' + e(u.name) + '</div>' +
            '<div class="small muted">' + e([u.grade, u.school, u.city].filter(Boolean).join(' · ') || 'Заполни профиль') + '</div>' +
            (u.role === 'admin' || u.role === 'root'
              ? '<span class="tag tag--lav" style="margin-top:6px">' + (u.role === 'root' ? 'Владелец' : (u.role === 'org' ? 'Управляющий организации' : 'Администратор')) + '</span>'
              : '') +
          '</div>' +
          '<button class="btn btn--soft btn--xs" onclick="SH.views.profile.editProfile()">' + icon('edit', 14) + 'Изменить</button>' +
        '</div>' +

        '<div class="readiness">' +
          '<div class="row"><span class="readiness__label">Готовность к поступлению</span>' +
            '<span class="spacer"></span><span class="readiness__value">' + r.total + '%</span></div>' +
          '<div class="progress" style="margin-top:10px"><i style="width:' + r.total + '%;background:var(--sky)"></i></div>' +
          '<div class="readiness__rows">' +
            r.parts.map((p) =>
              '<div class="readiness__row">' +
                '<span>' + e(p.label) + '</span>' +
                '<span class="readiness__hint">' + e(p.hint) + '</span>' +
                '<b>' + p.score + '<span class="readiness__max">/' + p.max + '</span></b>' +
              '</div>').join('') +
          '</div>' +
          '<button class="readiness__how" onclick="SH.views.profile.readinessInfo()">Как считается</button>' +
        '</div>' +

        syncCard() +

        '<div class="section-head"><span class="h2">Навыки</span></div>' +
        chips(u.skills || [], 'skills') +

        '<div class="section-head"><span class="h2">Интересы</span></div>' +
        chips(u.interests || [], 'interests') +

        '<div class="section-head"><span class="h2">Сохранённые события</span>' +
          (saved.length ? '<span class="section-link" onclick="SH.app.go(\'#/explore\')">Найти ещё</span>' : '') + '</div>' +
        (saved.length
          ? '<div class="list">' + saved.map(savedRow).join('') + '</div>'
          : ui.empty('bookmark', 'Пока ничего не сохранено',
              'Открой событие в Explore и нажми «Сохранить» — оно появится здесь и в напоминаниях.')) +

        '<div class="section-head"><span class="h2">Ещё</span></div>' +
        '<div class="list">' +
          row('install', 'Установить приложение', 'Иконка на главном экране', "SH.app.go('#/install')") +
          ((u.role === 'admin' || u.role === 'root')
            ? row('shield', 'Админ-панель', 'События, ученики, модерация', "SH.app.go('#/admin')", 'tag--lav')
            : '') +
          row('moon', 'Тема оформления', themeLabel(), 'SH.views.profile.themeSheet()') +
          row('lock', 'Пароль', 'Сменить пароль от аккаунта', 'SH.views.profile.passwordSheet()') +
          row('refresh', 'Обновить данные', 'Подтянуть свежее с сервера', 'SH.views.profile.refresh()') +
          row('logout', 'Выйти', 'Завершить сессию', 'SH.views.profile.logout()') +
        '</div>' +
      '</div>'
    );
  }

  function themeLabel() {
    const m = store.state.settings.theme;
    return m === 'system' ? 'Как в системе' : m === 'dark' ? 'Тёмная' : 'Светлая';
  }

  function chips(list, field) {
    return '<div class="wrap">' + list.map((v) =>
      '<span class="tag">' + e(v) +
        '<button class="chip-remove" onclick="SH.views.profile.removeChip(\'' + field + '\',\'' + e(v) + '\')" aria-label="Убрать">×</button>' +
      '</span>'
    ).join('') +
    '<button class="chip-add" onclick="SH.views.profile.addChip(\'' + field + '\')">' + icon('plus', 13) + 'Добавить</button></div>';
  }

  function savedRow(ev) {
    const dl = ui.deadlineInfo(ev.deadlineDate);
    const days = Math.ceil((new Date(ev.deadlineDate) - Date.now()) / 864e5);
    const soon = days >= 0 && days <= 5;
    return (
      '<div class="item card--tap" onclick="SH.app.go(\'#/event/' + ev.id + '\')" style="cursor:pointer">' +
        '<span class="empty__icon" style="width:40px;height:40px;border-radius:13px;background:var(--primary-soft);color:var(--primary)">' +
          icon((store.CATEGORIES[ev.category] || store.CATEGORIES.event).glyph, 19) + '</span>' +
        '<div class="grow" style="min-width:0">' +
          '<div class="ellipsis" style="font-weight:650;font-size:13.5px">' + e(ev.title) + '</div>' +
          '<div class="small muted">' + e(dl.label) + '</div>' +
        '</div>' +
        '<span class="tag tag--' + (soon ? 'sun' : 'mint') + '">' + e(ui.shortDate(ev.deadlineDate)) + '</span>' +
      '</div>'
    );
  }

  function row(ico, title, sub, action, tone) {
    return (
      '<button class="item" style="width:100%;text-align:left" onclick="' + action + '">' +
        '<span class="empty__icon" style="width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--text);margin:0">' +
          icon(ico, 18) + '</span>' +
        '<div class="grow" style="min-width:0">' +
          '<div style="font-weight:650;font-size:14px">' + e(title) + '</div>' +
          '<div class="small muted">' + e(sub) + '</div>' +
        '</div>' +
        (tone ? '<span class="tag ' + tone + '">admin</span>' : '') +
        '<span class="muted">' + icon('chevronRight', 17) + '</span>' +
      '</button>'
    );
  }

  /* ─────────────────────────── чужой профиль ─────────────────────────── */

  function user(id) {
    const u = store.userById(id);
    if (!u || !u.id) {
      return '<div class="screen">' + ui.empty('person', 'Профиль не найден', 'Возможно, аккаунт удалён.',
        '<button class="btn btn--brand" onclick="SH.app.go(\'#/community\')">В сообщество</button>') + '</div>';
    }

    const me = store.currentUser || {};
    const own = u.id === me.id;
    const posts = store.posts().filter((p) => p.authorId === u.id).slice(0, 3);
    const teams = store.teams().filter((t) => (t.members || []).includes(u.id));

    return (
      '<div class="screen">' +
        '<div class="screen-head" style="gap:8px">' +
          '<button class="icon-btn icon-btn--plain" onclick="SH.app.back()" aria-label="Назад">' + icon('arrowLeft', 21) + '</button>' +
          '<h1 class="screen-title grow" style="font-size:20px">Профиль</h1>' +
        '</div>' +

        '<div class="row" style="gap:14px;margin-bottom:16px">' +
          ui.avatar(u, 60) +
          '<div class="grow" style="min-width:0">' +
            '<div class="h2" style="font-size:20px">' + e(u.name) + '</div>' +
            '<div class="small muted">' + e([u.grade, u.school, u.city].filter(Boolean).join(' · ') || 'ученик') + '</div>' +
            (u.role === 'admin' || u.role === 'root'
              ? '<span class="tag tag--lav" style="margin-top:6px">' + (u.role === 'root' ? 'Владелец' : 'Администратор') + '</span>'
              : '') +
          '</div>' +
        '</div>' +

        (own
          ? '<button class="btn btn--soft btn--block" onclick="SH.app.go(\'#/profile\')">Это твой профиль — открыть настройки</button>'
          : '<button class="btn btn--brand btn--block" onclick="SH.views.chats.openWith(\'' + u.id + '\')">' +
              icon('message', 17) + 'Написать сообщение</button>') +

        ((u.skills || []).length
          ? '<div class="section-head"><span class="h2">Навыки</span></div><div class="wrap">' +
            u.skills.map((s) => ui.tag(s)).join('') + '</div>' : '') +

        ((u.interests || []).length
          ? '<div class="section-head"><span class="h2">Интересы</span></div><div class="wrap">' +
            u.interests.map((s) => ui.tag(s)).join('') + '</div>' : '') +

        (teams.length
          ? '<div class="section-head"><span class="h2">Команды</span></div><div class="list">' +
            teams.map((t) =>
              '<div class="item"><span class="empty__icon" style="width:38px;height:38px;border-radius:12px;background:var(--primary-soft);color:var(--primary);margin:0">' +
                icon('users', 17) + '</span><div class="grow"><div style="font-weight:650;font-size:13.5px">' + e(t.title) + '</div>' +
                '<div class="small muted">' + e(t.type) + '</div></div></div>').join('') + '</div>' : '') +

        (posts.length
          ? '<div class="section-head"><span class="h2">Публикации</span></div><div class="list">' +
            posts.map((p) =>
              '<div class="card" style="padding:12px"><p class="small" style="margin:0 0 6px;line-height:1.5">' + e(p.text) + '</p>' +
              '<div class="small muted">' + e(ui.relTime(p.createdAt)) + '</div></div>').join('') + '</div>' : '') +
      '</div>'
    );
  }

  /* ─────────────────────────── настройки ─────────────────────────── */

  const actions = {
    async backToAdmin() {
      const res = await store.backToAdmin();
      if (!res.ok) { ui.toast(res.error || 'Не удалось вернуться'); return; }
      ui.toast('Снова в админке');
      SH.app.go('#/admin');
    },

    addChip(field) {
      ui.sheet({
        title: 'Добавить в ' + (field === 'skills' ? 'навыки' : 'интересы'),
        body: ui.field('chip-input', '', { placeholder: field === 'skills' ? 'Например: Python' : 'Например: ИИ' }) +
          '<button class="btn btn--brand btn--block mt-16" onclick="SH.views.profile.saveChip(\'' + field + '\')">Добавить</button>',
        onMount(el) { setTimeout(() => { const i = el.querySelector('#chip-input'); if (i) i.focus(); }, 120); }
      });
    },

    saveChip(field) {
      const input = document.getElementById('chip-input');
      const v = input ? input.value.trim() : '';
      if (!v) return;
      const u = store.currentUser;
      const list = (u[field] || []).slice();
      if (!list.includes(v)) list.push(v);
      actions.persist({ [field]: list });
      ui.closeSheet();
      ui.toast('Сохранено');
      SH.app.render();
    },

    removeChip(field, value) {
      const u = store.currentUser;
      actions.persist({ [field]: (u[field] || []).filter((x) => x !== value) });
      SH.app.render();
    },

    /* сохраняем полный профиль: имя, класс, школа, город, навыки, интересы */
    persist(patch) {
      const u = store.currentUser;
      const full = {
        name: patch.name !== undefined ? patch.name : u.name,
        grade: patch.grade !== undefined ? patch.grade : u.grade,
        school: patch.school !== undefined ? patch.school : u.school,
        city: patch.city !== undefined ? patch.city : u.city,
        skills: patch.skills !== undefined ? patch.skills : u.skills,
        interests: patch.interests !== undefined ? patch.interests : u.interests
      };
      store.updateUser(patch);
      if (SH.api && SH.api.enabled()) {
        SH.api.saveProfile(full).catch((err) => ui.toast('Не сохранилось: ' + err.message));
      }
    },

    editProfile() {
      const u = store.currentUser;
      ui.sheet({
        title: 'Профиль',
        body:
          ui.field('p-name', 'Имя и фамилия', { value: u.name }) +
          '<div class="form-grid" style="margin-top:12px">' +
            ui.field('p-grade', 'Класс', { value: u.grade || '' }) +
            ui.field('p-city', 'Город', { value: u.city || '' }) +
          '</div>' +
          ui.field('p-school', 'Школа', { value: u.school || '', style: 'margin-top:12px' }) +
          '<button class="btn btn--brand btn--block mt-16" onclick="SH.views.profile.saveProfile()">Сохранить</button>'
      });
    },

    saveProfile() {
      const v = (id) => (document.getElementById(id) || {}).value || '';
      actions.persist({ name: v('p-name').trim() || 'Ученик', grade: v('p-grade'), school: v('p-school'), city: v('p-city') });
      ui.closeSheet();
      ui.toast('Профиль обновлён');
      SH.app.render();
    },

    readinessInfo() {
      const r = readinessOf(store.currentUser);
      ui.sheet({
        title: 'Готовность к поступлению',
        subtitle: 'Считается из твоих данных, а не задана вручную',
        body:
          '<div class="list">' +
            r.parts.map((p) =>
              '<div class="item"><div class="grow"><div style="font-weight:650;font-size:14px">' + e(p.label) + '</div>' +
                '<div class="small muted">' + e(p.hint) + '</div></div>' +
                '<b style="font-size:14px">' + p.score + '<span class="muted small">/' + p.max + '</span></b></div>').join('') +
          '</div>' +
          '<p class="small muted mt-16" style="margin-bottom:0">Чтобы процент рос: заполни класс, школу и город, добавь навыки и интересы, ' +
            'выполняй шаги в плане, сохраняй интересные события и участвуй в жизни сообщества.</p>'
      });
    },

    themeSheet() {
      const cur = store.state.settings.theme;
      ui.sheet({
        title: 'Тема',
        body:
          '<div class="list">' +
          [['system', 'Как в системе', 'Светлая днём, тёмная ночью'],
           ['light', 'Светлая', 'Всегда светлое оформление'],
           ['dark', 'Тёмная', 'Всегда тёмное оформление']].map(([val, title, sub]) =>
            '<button class="item" style="width:100%;text-align:left" onclick="SH.views.profile.setTheme(\'' + val + '\')">' +
              '<div class="grow"><div style="font-weight:650;font-size:14px">' + title + '</div>' +
              '<div class="small muted">' + sub + '</div></div>' +
              (cur === val ? '<span style="color:var(--primary)">' + icon('checkCircle', 20) + '</span>' : '') +
            '</button>').join('') +
          '</div>'
      });
    },

    setTheme(t) { store.setTheme(t); ui.closeSheet(); SH.app.render(); },

    passwordSheet() {
      ui.sheet({
        title: 'Сменить пароль',
        subtitle: 'После смены останешься в этой сессии',
        body:
          ui.field('pw-current', 'Текущий пароль', { type: 'password', autocomplete: 'current-password' }) +
          ui.field('pw-next', 'Новый пароль', { type: 'password', autocomplete: 'new-password', style: 'margin-top:12px' }) +
          ui.field('pw-next2', 'Повтори новый', { type: 'password', autocomplete: 'new-password', style: 'margin-top:12px' }) +
          '<div id="pw-error"></div>' +
          '<button class="btn btn--brand btn--block mt-16" onclick="SH.views.profile.savePassword()">Сохранить</button>'
      });
    },

    async savePassword() {
      const v = (id) => (document.getElementById(id) || {}).value || '';
      const box = document.getElementById('pw-error');
      const fail = (msg) => { if (box) box.innerHTML = '<p class="field-error">' + e(msg) + '</p>'; };

      if (!v('pw-current')) return fail('Введите текущий пароль');
      if (v('pw-next').length < 6) return fail('Новый пароль минимум 6 символов');
      if (v('pw-next') !== v('pw-next2')) return fail('Пароли не совпадают');

      try {
        await SH.api.changePassword(v('pw-current'), v('pw-next'));
        ui.closeSheet();
        ui.toast('Пароль обновлён');
      } catch (err) {
        fail(err.message);
      }
    },

    settings() { actions.themeSheet(); },

    async refresh() {
      try {
        const snap = await SH.api.bootstrap();
        if (snap) {
          store.hydrate(snap);
          ui.toast('Данные обновлены');
          SH.app.render();
        } else {
          ui.toast('Нет связи с сервером');
        }
      } catch (err) {
        ui.toast('Нет связи: ' + err.message);
      }
    },

    logout() {
      ui.confirmSheet('Выйти?', 'Сессия на сервере будет закрыта, токен удалён из браузера.', 'Выйти', async () => {
        await store.logout();
        ui.toast('Вы вышли');
        SH.app.go('#/auth');
      });
    }
  };

  /* ─────────────────────────── вход / регистрация ─────────────────────────── */

  function auth(mode) {
    const isLogin = mode !== 'register';

    return (
      '<div class="screen auth-screen">' +
        '<div class="auth-hero">' +
          SH.logoMark(66) +
          '<h1 style="font-size:26px;letter-spacing:-0.8px;margin:16px 0 6px">Student Hub</h1>' +
          '<p class="muted" style="margin:0;font-size:14px;max-width:310px;line-height:1.5">' +
            'Возможности, команды и личный план — в одном приложении для школы.</p>' +
        '</div>' +

        '<div style="width:100%;max-width:380px;margin:0 auto">' +
          '<div class="pill-row" style="justify-content:center;margin-bottom:20px">' +
            '<button class="pill" aria-pressed="' + isLogin + '" onclick="SH.app.go(\'#/auth\')">Вход</button>' +
            '<button class="pill" aria-pressed="' + !isLogin + '" onclick="SH.app.go(\'#/auth/register\')">Регистрация</button>' +
          '</div>' +

          (isLogin
            ? ui.field('auth-login', 'Логин или почта', { value: '', placeholder: 'Логин или почта', autocomplete: 'username' }) +
              ui.field('auth-pass', 'Пароль', { type: 'password', value: '', autocomplete: 'current-password', style: 'margin-top:12px' })
            : ui.field('auth-name', 'Имя и фамилия', { placeholder: 'Как тебя зовут' }) +
              ui.field('auth-login', 'Логин', { placeholder: 'Латиница, цифры, точка', style: 'margin-top:12px' }) +
              ui.field('auth-pass', 'Пароль', { type: 'password', placeholder: 'Минимум 6 символов', style: 'margin-top:12px' }) +
              ui.field('auth-grade', 'Класс', { placeholder: '10 класс', style: 'margin-top:12px' })) +

          ((store.state.meta && store.state.meta.authNotice)
            ? '<div class="alert alert--danger">' + e(store.state.meta.authNotice) + '</div>'
            : '') +
          '<div id="auth-error"></div>' +

          '<button class="btn btn--brand btn--block mt-16" id="auth-submit" ' +
            'onclick="SH.views.profile.submitAuth(\'' + (isLogin ? 'login' : 'register') + '\')">' +
            (isLogin ? 'Войти' : 'Создать аккаунт') + icon('arrowRight', 18) + '</button>' +

          (isLogin
            ? '<p class="center small muted mt-16" style="line-height:1.5">Забыл пароль? Попроси администратора школы выдать новый.</p>'
            : '<p class="center small muted mt-16" style="line-height:1.5">Аккаунт появится сразу — подтверждение почты не нужно.</p>') +
        '</div>' +
      '</div>'
    );
  }

  function setBusy(busy) {
    const btn = document.getElementById('auth-submit');
    if (!btn) return;
    if (busy) {
      btn.setAttribute('data-label', btn.innerHTML);
      btn.innerHTML = 'Проверяю…';
      btn.disabled = true;
    } else {

  /* ───────────────────────── вспомогательное ───────────────────────── */

  function roleTag(role) {
    if (role === 'root') return '<span class="tag tag--lav">владелец</span>';
    if (role === 'admin') return '<span class="tag tag--sky">админ</span>';
    if (role === 'org') return '<span class="tag tag--lav">управляющий</span>';
    return '<span class="tag">ученик</span>';
  }

  async function loadData(force) {
    if (!isAdminLike()) return;
    const jobs = [];
    const load = (name, fn) => {
      if (!force && cache.loaded[name]) return;
      jobs.push(fn().then((r) => { cache[name] = r; cache.loaded[name] = true; }).catch(() => {}));
    };

    load('users', () => SH.api.adminUsers().then((r) => r.users || []));
    load('moderation', () => SH.api.adminModeration().then((r) => r.posts || []));
    load('aiKeys', () => SH.api.adminAiKeys().then((r) => { cache.envKeys = r.envKeys || 0; return r.keys || []; }));
    load('prompts', () => SH.api.adminPrompts().then((r) => r.prompts || []));
    load('audit', () => SH.api.adminAudit().then((r) => r.log || []));
    load('orgs', () => SH.api.adminOrgs().then((r) => r.orgs || []));

    await Promise.all(jobs);
  }

  /* ───────────────────────── действия ───────────────────────── */

  const actions = {
    go(sec) {
      if (section === sec) return;
      section = sec;
      query = '';
      SH.app.render();
    },

    // вызывается роутером после каждой отрисовки: догружаем недостающее один раз
    mount() {
      mountSearch();
      mountNavScroll();
      mountRestore();
      if (adminMount.pending) return;
      const missing = ['users', 'moderation', 'aiKeys', 'prompts', 'audit', 'orgs']
        .filter((n) => !cache.loaded[n]);
      if (!missing.length) return;
      adminMount.pending = true;
      loadData().then(() => {
        adminMount.pending = false;
        if (SH.views.admin.getSection() === section) SH.app.render();
      });
    },

    /* события */
    eventForm(id) {
      const ev = id ? store.event(id) : null;
      const cats = Object.keys(store.CATEGORIES).map((k) => ({ value: k, label: store.CATEGORIES[k].label }));

      ui.sheet({
        title: ev ? 'Редактировать событие' : 'Новое событие',
        body:
          ui.field('ev-title', 'Название', { value: ev ? ev.title : '', placeholder: 'Олимпиада по физике' }) +
          '<div class="form-grid" style="margin-top:12px">' +
            ui.field('ev-org', 'Организатор', { value: ev ? ev.organizer : 'Школа №1520' }) +
            ui.field('ev-date', 'Дедлайн', { type: 'date', value: ev ? String(ev.deadlineDate).slice(0, 10) : '' }) +
          '</div>' +
          ui.field('ev-desc', 'Описание', { value: ev ? ev.description : '', textarea: true, style: 'margin-top:12px' }) +
          '<div class="form-grid" style="margin-top:12px">' +
            ui.select('ev-cat', 'Категория', cats, ev ? ev.category : 'event') +
            ui.select('ev-format', 'Формат', [
              { value: 'Онлайн', label: 'Онлайн' },
              { value: 'Офлайн', label: 'Офлайн' },
              { value: 'Гибрид', label: 'Гибрид' }
            ], ev ? ev.format : 'Онлайн') +
          '</div>' +
          '<div class="form-grid" style="margin-top:12px">' +
            ui.field('ev-priority', 'Приоритет (выше — раньше в списке)', { type: 'number', value: String(ev ? ev.priority || 0 : 0) }) +
            ui.select('ev-status', 'Статус', [
              { value: 'published', label: 'Опубликовано' },
              { value: 'draft', label: 'Черновик' }
            ], ev ? ev.status : 'published') +
          '</div>' +

          '<div class="field" style="margin-top:12px">' +
            '<label class="field-label">Картинка события</label>' +
            '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">' +
              '<input id="ev-image-url" placeholder="Вставьте ссылку на изображение" value="' + e(ev && /^https?:/.test(ev.image || '') ? ev.image : '') + '" style="flex:1;min-width:180px;min-height:46px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;outline:none">' +
              '<label class="btn btn--soft btn--sm" style="cursor:pointer">' + icon('download', 15) + 'Файл' +
                '<input type="file" id="ev-image-file" accept="image/*" style="display:none"></label>' +
            '</div>' +
            '<div id="ev-image-preview" style="margin-top:10px"></div>' +
          '</div>' +

          ui.field('ev-tags', 'Теги через запятую', { value: ev ? (ev.tags || []).join(', ') : '', style: 'margin-top:12px' }) +
          ui.field('ev-elig', 'Кто может участвовать', { value: ev ? ev.eligibility || '' : 'Все классы', style: 'margin-top:12px' }) +

          '<div class="row mt-16" style="gap:10px">' +
            '<button class="btn btn--soft grow" data-close>Отмена</button>' +
            '<button class="btn btn--brand grow" onclick="SH.views.admin.saveEvent(' + (ev ? "'" + ev.id + "'" : 'null') + ')">Сохранить</button>' +
          '</div>',

        onMount(el) {
          const state = { dataUrl: ev && ev.image && ev.image.startsWith('data:') ? ev.image : '' };
          const prev = el.querySelector('#ev-image-preview');
          const urlInput = el.querySelector('#ev-image-url');
          const fileInput = el.querySelector('#ev-image-file');

          const paint = () => {
            const src = state.dataUrl || urlInput.value.trim() || (ev ? ev.image || '' : '');
            prev.innerHTML = src
              ? '<img class="img-preview" src="' + e(src) + '" alt="Превью">'
              : '<div class="img-preview" style="display:grid;place-items:center;color:var(--muted);font-size:12.5px">Превью появится здесь</div>';
          };

          urlInput.addEventListener('input', () => { state.dataUrl = ''; paint(); });

          fileInput.addEventListener('change', (ev2) => {
            const file = ev2.target.files[0];
            if (!file) return;
            if (file.size > 600 * 1024) {
              ui.toast('Файл больше 600 КБ — уменьшите или используйте ссылку');
              return;
            }
            const reader = new FileReader();
            reader.onload = () => {
              state.dataUrl = reader.result;
              urlInput.value = '';
              paint();
            };
            reader.readAsDataURL(file);
          });

          paint();
          el._imageState = state;
        }
      });
    },

    saveEvent(id) {
      const v = (f) => (document.getElementById(f) || {}).value || '';
      if (!v('ev-title').trim()) { ui.toast('Добавьте название'); return; }

      const sheetEl = document.querySelector('.sheet');
      const imgState = sheetEl && sheetEl._imageState ? sheetEl._imageState : { dataUrl: '' };
      const image = imgState.dataUrl || v('ev-image-url').trim();

      const payload = {
        title: v('ev-title').trim(),
        organizer: v('ev-org').trim(),
        description: v('ev-desc').trim(),
        category: v('ev-cat'),
        format: v('ev-format'),
        deadlineDate: new Date(v('ev-date') || Date.now() + 14 * 864e5).toISOString(),
        status: v('ev-status'),
        priority: Number(v('ev-priority')) || 0,
        eligibility: v('ev-elig').trim(),
        tags: v('ev-tags').split(',').map((s) => s.trim()).filter(Boolean),
        image,
        isFree: true
      };

      if (id) payload.id = id;
      store.saveEvent(payload);
      ui.closeSheet();
      ui.toast(id ? 'Событие обновлено' : 'Событие создано');
      SH.app.render();
    },

    moveEvent(id, delta) {
      const ev = store.event(id);
      if (!ev) return;
      const next = Math.max(0, (ev.priority || 0) + delta);
      store.saveEvent(Object.assign({}, ev, { priority: next }));
      SH.app.render();
    },

    removeEvent(id) {
      ui.confirmSheet('Удалить событие?', 'Оно исчезнет у всех учеников. Действие необратимо.', 'Удалить', () => {
        store.deleteEvent(id);
        ui.toast('Событие удалено');
        SH.app.render();
      });
    },

    /* массовые операции */
    toggleSelect(kind) {
      selectMode[kind] = !selectMode[kind];
      picked[kind].clear();
      SH.app.render();
    },

    pick(kind, id, on) {
      if (on) picked[kind].add(id); else picked[kind].delete(id);
      SH.app.render();
    },

    pickAll(kind) {
      if (!selectMode[kind]) return;
      if (kind === 'users') {
        cache.users.filter((u) => u.role !== 'root' && u.id !== (store.currentUser || {}).id)
          .forEach((u) => picked.users.add(u.id));
      } else {
        store.state.events.forEach((ev) => picked.events.add(ev.id));
      }
      SH.app.render();
    },

    bulkDelete(kind) {
      const ids = Array.from(picked[kind]);
      if (!ids.length) return;
      const what = kind === 'users' ? 'пользователей' : 'событий';
      ui.confirmSheet('Удалить ' + ids.length + ' ' + what + '?',

    async saveUser(id) {
      const v = (f) => (document.getElementById(f) || {}).value || '';

      if (!name) { ui.toast('Введите имя'); return; }

      try {
        if (!id) {
          const password = v('u-pass').trim();
          const role = (document.getElementById('u-role') || {}).value || 'student';
          const res = await SH.api.adminCreateUser({
            name, login: v('u-login').trim(), password,
            grade: v('u-grade'), school: v('u-school'), role,
            orgId: v('u-org') || null
          });
          ui.closeSheet();
          ui.sheet({
            title: 'Пользователь создан',
            body: '<p class="small muted" style="margin:0 0 12px">Передайте данные для входа:</p>' +
              '<div class="card" style="background:var(--chip);border:0">' +

              '</div>' +
              '<button class="btn btn--brand btn--block mt-16" data-close>Готово</button>'
          });
        } else {
          const patch = {
            name, login: v('u-login').trim(),
            grade: v('u-grade'), school: v('u-school')
          };
          const orgSel = document.getElementById('u-org');
          if (orgSel) patch.orgId = orgSel.value || null;
          const roleSel = document.getElementById('u-role');
          if (roleSel) patch.role = roleSel.value;

          await SH.api.adminUpdateUser(id, patch);

          const pass = v('u-pass').trim();
          if (pass) await SH.api.adminResetPassword(id, pass);

          ui.closeSheet();
          ui.toast('Сохранено');
        }
        cache.loaded.users = false;
        await loadData(true);
        SH.app.render();
      } catch (err) {
        ui.toast('Ошибка: ' + err.message);
      }

      ui.sheet({
        title: pr.title,
        subtitle: 'Где используется: ' + pr.whereUsed,
        body:
          '<div class="field-label">Текст промта</div>' +
          '<textarea id="prompt-text" spellcheck="false" style="min-height:230px;width:100%;padding:12px 14px;' +
            'background:var(--surface);border:1.5px solid var(--border);border-radius:14px;outline:none;' +
            'font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;line-height:1.6">' +
            e(pr.template) + '</textarea>' +
          '<p class="small muted mt-12" style="margin-bottom:0">Переменные: {{goal}}, {{event}}, {{description}}, {{tags}}, ' +
            '{{grade}}, {{skills}}, {{interests}}, {{stats}}.</p>' +
          '<button class="btn btn--brand btn--block mt-16" onclick="SH.views.admin.savePrompt(\'' + key + '\')">Сохранить</button>'
      });
    },

    async savePrompt(key) {
      const el = document.getElementById('prompt-text');
      const template = el ? el.value.trim() : '';
      if (template.length < 10) { ui.toast('Слишком короткий промт'); return; }
      try {
        await SH.api.adminSavePrompt(key, template);
        ui.closeSheet();
        ui.toast('Промт сохранён');
        cache.loaded.prompts = false;
        await loadData(true);
        SH.app.render();
      } catch (err) { ui.toast('Ошибка: ' + err.message); }
    },

    async resetPrompt(key) {
      const pr = cache.prompts.find((x) => x.key === key);
      if (!pr || !pr.defaultTemplate) return;
      try {
        await SH.api.adminSavePrompt(key, pr.defaultTemplate);
        ui.toast('Промт сброшен к стандартному');
        cache.loaded.prompts = false;
        await loadData(true);
        SH.app.render();
      } catch (err) { ui.toast('Ошибка: ' + err.message); }
    },

    /* ИИ-сводка по данным школы */
    async digest() {
      ui.sheet({
        title: 'ИИ-сводка',
        subtitle: 'Модель смотрит на цифры платформы',
        body: '<div style="padding:8px 0 4px">' + ui.skeletonList(3) + '</div>',
        dismissible: false
      });
      const s = store.stats();
      const stats = 'учеников ' + s.students + ', админов ' + s.admins + ', событий ' + s.events +
        ', черновиков ' + s.drafts + ', публикаций ' + s.posts + ', жалоб ' + s.flagged;
      const text = await SH.ai.complete({ promptKey: 'digest', vars: { stats } });
      const lines = text ? text.split('\n').filter(Boolean) : SH.ai.digest();
      ui.closeSheet();
      ui.sheet({
        title: 'ИИ-сводка',
        subtitle: text ? 'Ответ модели' : 'Локальный расчёт',
        body: '<div class="list">' + lines.map((line) =>
          '<div class="rowline" style="align-items:flex-start"><span class="muted" style="margin-top:2px">' +
            icon('sparkles', 15) + '</span><div style="font-size:13.5px;line-height:1.5">' + e(line) + '</div></div>'
        ).join('') + '</div>' +
        '<button class="btn btn--brand btn--block mt-16" data-close>Понятно</button>'
      });
    },

    /* бэкап */
    async backup() {
      ui.toast('Готовлю файл…');
      try {
        const res = await SH.api.adminBackup();
        const payload = JSON.stringify(res.data, null, 2);
        const blob = new Blob([payload], { type: 'application/json' });
        const a = document.createElement('a');
        const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
        a.href = URL.createObjectURL(blob);
        a.download = 'student-hub-backup-' + stamp + '.json';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        ui.toast('Файл скачан');
      } catch (err) { ui.toast('Ошибка: ' + err.message); }
    },

    async restoreFile(file) {
      if (!file) return;
      let data;
      try {
        data = JSON.parse(await file.text());
      } catch (e) { ui.toast('Файл не читается: нужен JSON'); return; }
      const rows = data && data.tables
        ? Object.keys(data.tables).map((k) => k + ': ' + (data.tables[k] || []).length).join(', ')
        : 'неизвестно';
      ui.confirmSheet('Восстановить базу из файла?',
        'Текущие данные будут заменены. Содержимое файла — ' + rows + '.', 'Восстановить', async () => {
          try {
            const res = await SH.api.adminRestore(data);
            ui.toast('Готово: ' + Object.keys(res.restored || {}).length + ' таблиц');
            cache.loaded.users = false;
            await loadData(true);
            SH.app.render();
          } catch (err) { ui.toast('Ошибка: ' + err.message); }
        });
    },

    /* прочее */
    exportCsv() {
      const rows = [['Имя', 'Логин', 'Роль', 'Класс', 'Школа', 'Состояние']];
      (cache.users.length ? cache.users : store.state.users).forEach((u) => {
        rows.push([
          u.name, u.email || '', u.role, u.grade || '', u.school || '',
          u.blocked ? 'заблокирован' : 'активен'
        ]);
      });
      const csv = rows.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'student-hub-users.csv';
      a.click();
      ui.toast('CSV скачан');
    }
  };

  function accessRow(ico, title, sub, action) {
    return '<button class="item" style="width:100%;text-align:left" onclick="' + action + '">' +
      '<span class="empty__icon" style="width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--text);margin:0">' +
        icon(ico, 18) + '</span>' +
      '<div class="grow" style="min-width:0"><div style="font-weight:650;font-size:13.5px">' + e(title) + '</div>' +
      '<div class="small muted">' + e(sub) + '</div></div>' +
      '<span class="muted">' + icon('chevronRight', 17) + '</span></button>';
  }

  SH.views = SH.views || {};
  SH.views.admin = Object.assign({ html, mount: actions.mount, loadData }, actions);
  SH.views.admin.getSection = () => section;
  SH.views.admin.resetCache = () => { Object.keys(cache.loaded).forEach((k) => delete cache.loaded[k]); };
})(window.SH = window.SH || {});

/* ==========================================================================
   Кабинет организации (B2B): ученики, задачи и календарь портфеля.
   Доступен управляющему организации, а также админу и владельцу платформы
   (они могут открыть любую организацию: #/org/<id>).
   ========================================================================== */
(function (SH) {
  'use strict';

  const e = SH.ui.esc;
  const icon = SH.icon;
  const store = SH.store;

  const KIND = {
    external: { label: 'Внешний дедлайн', color: '#e74c3c', soft: '#fde8e6' },
    internal: { label: 'Внутренняя задача', color: '#3b82f6', soft: '#e6efff' },
    milestone: { label: 'Веха проекта', color: '#22a06b', soft: '#e3f7ec' }
  };

  let data = { org: null, manager: null, students: [], slots: [], deadlines: [], kpi: null };
  let tab = 'overview';
  let month = startOfMonth(new Date());
  let loading = false;
  let error = '';
  let loadedFor = '';

  function startOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
  function monthName() {
    const m = SH.ui.MONTHS[month.getMonth()] || '';
    return m.charAt(0).toUpperCase() + m.slice(1) + ' ' + month.getFullYear();
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseDay(s) { const p = String(s || '').slice(0, 10).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayLabel(d) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const diff = Math.round((d - today) / 864e5);
    if (diff === 0) return 'сегодня';
    if (diff === 1) return 'завтра';
    if (diff === -1) return 'вчера';
    return d.getDate() + ' ' + SH.ui.MONTHS[d.getMonth()].toLowerCase();
  }

  /* ─────────────────────────── данные ─────────────────────────── */

  function orgId() {
    const route = (location.hash.replace(/^#\/?/, '').split('/') || []);
    if (route[0] === 'org' && route[1]) return route[1];
    const me = store.currentUser || {};
    return me.orgId || null;
  }

  function load(force) {
    const id = orgId();
    if (!id) { data = { org: null, students: [], slots: [], deadlines: [], kpi: null }; return Promise.resolve(); }
    if (!force && loadedFor === id) return Promise.resolve();
    loading = true; error = '';
    return SH.api.orgOverview(id)
      .then((d) => {
        data = d || data;
        loadedFor = id;
      })
      .catch((err) => { error = err.message || 'Не удалось загрузить организацию'; })
      .finally(() => {
        loading = false;
        if (SH.app && store.isAuthed) SH.app.render();
      });
  }

  /* ─────────────────────────── разметка ─────────────────────────── */

  function kpiBar() {
    const k = data.kpi || { students: 0, open: 0, overdue: 0, weekDeadlines: 0 };
    const item = (value, label, tone) =>
      '<div class="kpi-card">' +
        '<div class="kpi__value' + (tone ? ' kpi__value--' + tone : '') + '">' + value + '</div>' +
        '<div class="kpi__label">' + e(label) + '</div>' +
      '</div>';
    return '<div class="kpi-row">' +
      item(k.students, 'учеников') +
      item(k.open, 'задач в работе') +
      item(k.overdue, 'просрочено', k.overdue ? 'danger' : '') +
      item(k.weekDeadlines, 'дедлайнов на неделе') +
    '</div>';
  }

  function tabs() {
    const list = [['overview', 'Обзор'], ['students', 'Ученики'], ['calendar', 'Календарь']];
    return '<div class="segmented">' + list.map(([id, label]) =>
      '<button class="segmented__item' + (tab === id ? ' is-active' : '') +
        '" onclick="SH.views.org.setTab(\'' + id + '\')">' + e(label) + '</button>'
    ).join('') + '</div>';
  }

  function slotChip(s, compact) {
    const k = KIND[s.kind] || KIND.internal;
    const student = data.students.find((u) => u.id === s.studentId);
    return '<div class="cal-item cal-item--' + e(s.kind || 'internal') + (s.done ? ' is-done' : '') + '"' +
      ' draggable="true" title="' + e(s.title) + '" ondragstart="SH.views.org.dragStart(event,\'' + s.id + '\')"' +
      ' onclick="SH.views.org.openSlot(\'' + s.id + '\')"' +
      ' style="--cal-color:' + k.color + ';--cal-soft:' + k.soft + '">' +
      '<span class="cal-item__dot"></span>' +
      '<span class="cal-item__text">' + e(s.title) + (compact || !student ? '' : ' · ' + e(student.name.split(' ')[0])) + '</span>' +
    '</div>';
  }

  function overviewTab() {
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const horizon = new Date(now.getTime() + 30 * 864e5);
    const upcoming = []
      .concat((data.deadlines || []).map((d) => ({ date: d.date, title: d.title, kind: 'external', studentId: d.studentId, eventId: d.eventId })))
      .concat((data.slots || []).map((s) => ({ date: s.date, title: s.title, kind: s.kind, studentId: s.studentId, id: s.id, done: s.done })))
      .filter((x) => x.date && parseDay(x.date) >= new Date(now.getTime() - 864e5) && parseDay(x.date) <= horizon)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)))
      .slice(0, 20);

    if (!data.org) {
      return ui_empty('Организация не найдена', 'Владелец платформы ещё не привязал вас к организации.');
    }

    return (
      '<div class="panel">' +
        '<div class="panel__head"><span class="h3">Ближайшие 30 дней</span>' +
          '<button class="btn btn--soft btn--sm" onclick="SH.views.org.slotForm()">' + icon('plus', 15) + 'Задача</button></div>' +
        (upcoming.length
          ? '<div class="list-flat">' + upcoming.map((x) => {
              const k = KIND[x.kind] || KIND.internal;
              const student = data.students.find((u) => u.id === x.studentId);
              return '<div class="row-line" style="--cal-color:' + k.color + '">' +
                '<span class="row-line__mark"></span>' +
                '<span class="row-line__date">' + e(dayLabel(parseDay(x.date))) + '</span>' +
                '<span class="row-line__title' + (x.done ? ' is-done' : '') + '">' + e(x.title) + '</span>' +
                '<span class="row-line__who">' + e(student ? student.name.split(' ')[0] : (x.kind === 'external' ? 'дедлайн' : 'вся команда')) + '</span>' +
              '</div>';
            }).join('') + '</div>'
          : ui_empty('Пока пусто', 'Добавьте задачу или дождитесь дедлайнов учеников.')) +
      '</div>' +

      '<div class="panel mt-16">' +
        '<div class="panel__head"><span class="h3">Кто в зоне риска</span>' +
          '<button class="btn btn--soft btn--sm" onclick="SH.views.org.setTab(\'calendar\')">Календарь</button></div>' +
        riskList() +
      '</div>'
    );
  }

  function riskList() {
    const now = new Date();
    const rows = (data.slots || []).filter((s) => !s.done && parseDay(s.date) < now);
    if (!rows.length) return '<p class="small muted" style="margin:10px 2px">Просроченных задач нет — все в графике.</p>';
    return '<div class="list-flat">' + rows.slice(0, 12).map((s) => {
      const student = data.students.find((u) => u.id === s.studentId);
      return '<div class="row-line" style="--cal-color:' + (KIND[s.kind] || KIND.internal).color + '">' +
        '<span class="row-line__mark"></span>' +
        '<span class="row-line__date">' + e(dayLabel(parseDay(s.date))) + '</span>' +
        '<span class="row-line__title">' + e(s.title) + '</span>' +
        '<span class="row-line__who">' + e(student ? student.name.split(' ')[0] : 'команда') + '</span>' +
      '</div>';
    }).join('') + '</div>';
  }

  function studentsTab() {
    if (!data.students.length) {
      return '<div class="panel">' +
        ui_empty('В организации пока никого нет', 'Создайте первый аккаунт ученика — он сразу войдёт под этим логином.',
          '<button class="btn btn--brand" onclick="SH.views.org.studentForm()">' + icon('plus', 16) + 'Создать аккаунт</button>') +
      '</div>';
    }
    return '<div class="panel panel--flush">' +
      '<div class="panel__pad row"><span class="h3">Ученики и сотрудники</span><span class="spacer"></span>' +
        '<button class="btn btn--brand btn--sm" onclick="SH.views.org.studentForm()">' + icon('plus', 15) + 'Создать аккаунт</button></div>' +
      '<div class="table-wrap"><table class="table"><thead><tr>' +
        '<th>Кто</th><th>Роль</th><th>Класс</th><th>Задачи</th><th>Состояние</th>' +
      '</tr></thead><tbody>' +
      data.students.map((u) => {
        const mine = data.slots.filter((s) => s.studentId === u.id);
        const open = mine.filter((s) => !s.done).length;
        return '<tr>' +
          '<td><div style="display:flex;gap:10px;align-items:center">' + SH.ui.avatar(u, 32) +
            '<div><div style="font-weight:650">' + e(u.name) + '</div>' +
            '<div class="small muted mono">' + e(u.email || '—') + '</div></div></div></td>' +
          '<td>' + (u.role === 'org' ? '<span class="tag tag--lav">управляющий</span>'
            : (u.role === 'admin' ? '<span class="tag tag--lav">админ</span>' : '<span class="tag">ученик</span>')) + '</td>' +
          '<td>' + e(u.grade || '—') + '</td>' +
          '<td>' + (open ? open + ' в работе' : '—') + '</td>' +
          '<td>' + (u.blocked ? '<span class="tag tag--blush">заблокирован</span>' : '<span class="tag tag--mint">активен</span>') + '</td>' +
        '</tr>';
      }).join('') +
      '</tbody></table></div></div>';
  }

  function calendarTab() {
    const first = new Date(month.getFullYear(), month.getMonth(), 1);
    const startShift = (first.getDay() + 6) % 7; // понедельник первый
    const gridStart = new Date(first.getFullYear(), first.getMonth(), 1 - startShift);
    const cells = [];
    const today = new Date(); today.setHours(0, 0, 0, 0);

    const events = {};
    (data.deadlines || []).forEach((d) => {
      const key = String(d.date).slice(0, 10);
      (events[key] = events[key] || []).push({ kind: 'external', title: d.title, studentId: d.studentId, external: true });
    });
    (data.slots || []).forEach((s) => {
      const key = String(s.date).slice(0, 10);
      (events[key] = events[key] || []).push(s);
    });

    for (let i = 0; i < 42; i++) {
      const d = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      const key = ymd(d);
      const list = (events[key] || []).slice(0, 3);
      const more = (events[key] || []).length - list.length;
      cells.push(
        '<div class="cal-cell' + (d.getMonth() !== month.getMonth() ? ' is-out' : '') +
          (d.getTime() === today.getTime() ? ' is-today' : '') + '"' +
          ' ondragover="event.preventDefault()" ondrop="SH.views.org.drop(event,\'' + key + '\')"' +
          ' onclick="SH.views.org.slotForm(null,\'' + key + '\')">' +
          '<div class="cal-cell__num">' + d.getDate() + '</div>' +
          list.map((x) => x.external
            ? '<div class="cal-item cal-item--external" title="' + e(x.title) + '" style="--cal-color:' + KIND.external.color + ';--cal-soft:' + KIND.external.soft + '">' +
                '<span class="cal-item__dot"></span><span class="cal-item__text">' + e(x.title) + '</span></div>'
            : slotChip(x, true)).join('') +
          (more > 0 ? '<div class="cal-more">+' + more + '</div>' : '') +
        '</div>'
      );
    }

    return (
      '<div class="panel">' +
        '<div class="cal-head">' +
          '<div class="cal-nav">' +
            '<button class="icon-btn icon-btn--plain" onclick="SH.views.org.shiftMonth(-1)" aria-label="Предыдущий месяц">' + icon('arrowLeft', 18) + '</button>' +
            '<div class="cal-title">' + monthName() + '</div>' +
            '<button class="icon-btn icon-btn--plain" onclick="SH.views.org.shiftMonth(1)" aria-label="Следующий месяц">' + icon('arrowRight', 18) + '</button>' +
          '</div>' +
          '<div class="cal-actions">' +
            '<button class="btn btn--soft btn--sm" onclick="SH.views.org.todayMonth()">Сегодня</button>' +
            '<button class="btn btn--brand btn--sm" onclick="SH.views.org.slotForm()">' + icon('plus', 15) + 'Задача</button>' +
          '</div>' +
        '</div>' +
        '<div class="cal-legend">' +
          ['external', 'internal', 'milestone'].map((k) =>
            '<span class="cal-legend__item"><i style="background:' + KIND[k].color + '"></i>' + KIND[k].label + '</span>').join('') +
          '<span class="cal-legend__hint">перетащите задачу на другой день, чтобы перенести дедлайн</span>' +
        '</div>' +
        '<div class="cal-grid cal-grid--head">' +
          ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map((d) => '<div class="cal-dow">' + d + '</div>').join('') +
        '</div>' +
        '<div class="cal-grid">' + cells.join('') + '</div>' +
      '</div>'
    );
  }

  function ui_empty(title, text, action) {
    return '<div class="empty" style="padding:28px 12px">' +
      '<div class="empty__icon">' + icon('grid') + '</div>' +
      '<h3>' + e(title) + '</h3><p>' + e(text) + '</p>' +
      (action ? '<div class="mt-16">' + action + '</div>' : '') +
    '</div>';
  }

  function html() {
    const me = store.currentUser || {};
    const isStaff = me.role === 'admin' || me.role === 'root';
    const org = data.org;
    const title = org ? org.name : (isStaff ? 'Организации' : 'Моя организация');

    return '<div class="screen screen--org">' +
      '<div class="screen-head">' +
        '<div class="grow">' +
          '<h1 class="screen-title">' + e(title) + '</h1>' +
          '<p class="screen-sub">' +
            (org
              ? (org.plan === 'school' ? 'Школа' : 'Агентство') +
                (org.city ? ' · ' + e(org.city) : '') +
                (org.managerName ? ' · управляющий ' + e(org.managerName) : '')
              : 'B2B-кабинет: ученики, задачи и дедлайны в одном календаре') +
          '</p>' +
        '</div>' +
        (isStaff
          ? '<button class="btn btn--soft btn--sm" onclick="SH.app.go(\'#/admin\')">В админку</button>'
          : '') +
      '</div>' +

      (error ? '<div class="alert alert--danger">' + e(error) + '</div>' : '') +
      (loading && !org ? '<div class="panel">' + SH.ui.skeletonList(3) + '</div>' : '')

      + (org ? kpiBar() + tabs() : '')

      + (org
          ? (tab === 'students' ? studentsTab() : tab === 'calendar' ? calendarTab() : overviewTab())
          : (loading ? '' : noOrgBlock(isStaff)))

      + '<div style="height:24px"></div>' +
    '</div>';
  }

  function noOrgBlock(isStaff) {
    if (isStaff) {
      return '<div class="panel">' + ui_empty('Организаций пока нет',
        'Создайте первую организацию в админке — раздел «Организации».',
        '<button class="btn btn--brand" onclick="SH.app.go(\'#/admin\')">Открыть админку</button>') + '</div>';
    }
    return '<div class="panel">' + ui_empty('Нет привязки к организации',
      'Напишите администратору платформы: он добавит вас в организацию — и здесь появятся ученики.') + '</div>';
  }

  /* ─────────────────────────── действия ─────────────────────────── */

  const actions = {
    setTab(next) { tab = next; SH.app.render(); },
    shiftMonth(delta) {

      SH.ui.sheet({
        title: slot.title,
        subtitle: dayLabel(parseDay(slot.date)) + ' · ' + (KIND[slot.kind] || KIND.internal).label,
        body:
          '<p class="small muted" style="margin:0 0 14px">' + (slot.note ? e(slot.note) : 'Без описания') + '</p>' +
          '<div class="row" style="gap:10px;flex-wrap:wrap">' +

        onMount(el, destroy) {

                  body:

    async prompt() {
      if (!this.promptEvent) {
        ui.toast('Открой меню браузера → «Установить приложение»');
        return;
      }
      this.promptEvent.prompt();
      const choice = await this.promptEvent.userChoice;
      this.promptEvent = null;
      if (choice.outcome === 'accepted') {
        ui.toast('Готово! Иконка на главном экране');
        SH.app.render();
      }
    },
    init() {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        this.promptEvent = e;
        if (location.hash === '#/install') SH.app.render();

        this.promptEvent = null;

    ['community', 'groups', 'Сообщество'],
    ['roadmap', 'map', 'Роадмап'],
    ['chats', 'chat', 'Чаты'],
    ['profile', 'person', 'Профиль']
  ];

  const ORG_TABS = [
    ['org', 'grid', 'Организация'],
    ['community', 'groups', 'Сообщество'],
    ['chats', 'chat', 'Чаты'],

    // печатающий человек не должен из-за этого терять исходящие сообщения.
    if (SH.api.outbox && SH.api.outbox().length) SH.api.flush().catch(() => {});

    // Перерисовку бережём: пока в фокусе поле ввода или открыт лист,
    // данные обновляем молча, иначе введённый текст и позиция курсора умрут.
    const focused = document.activeElement;
    const busy = (focused && /^(INPUT|TEXTAREA)$/.test(focused.tagName)) || !!document.querySelector('.sheet, .modal');

    const snapshot = await SH.api.bootstrap();
    if (!snapshot) return false;
    store.hydrate(snapshot, busy);
    // при «тихой» синхронизации DOM не перерисовываем, но открытый тред дополняем
    if (busy && location.hash.indexOf('#/chat/') === 0 && SH.views.chats && SH.views.chats.syncOpen) {
      SH.views.chats.syncOpen(location.hash.split('/')[2]);
    }
    return true;
  }

  const app = {
    resync,
    go(hash) {
      if (location.hash === hash) { render(); return; }
      location.hash = hash;
    },
    back() {
      if (history.length > 1) history.back();
      else app.go('#/explore');
    },
    render
  };

  /* ─────────────────────────── старт ─────────────────────────── */

  function boot() {
    store.init();
    install.init();

    // сервер сказал 401 при живом токене → сессия истекла, честно уводим на вход
    if (SH.api) {
      SH.api.onAuthLost = () => {
        if (!store.isAuthed) return;
        store.forceLogout('Сессия истекла — войди заново');
      };
    }

    // приложению в отдельном окне нужен свой app-shell (см. styles.css)
    function markStandalone() {
      document.documentElement.classList.toggle('pwa-standalone', install.isStandalone());
    }
    markStandalone();
    if (window.matchMedia) {
      try { window.matchMedia('(display-mode: standalone)').addEventListener('change', markStandalone); } catch (e) {}
    }

    store.on(() => render());

    window.addEventListener('hashchange', render);

    // тема «как в системе» должна реагировать на смену настроек ОС
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        if (store.state.settings.theme === 'system') SH.applyTheme('system');
      });
    }

    // связь: показываем состояние и сами подтягиваем данные, когда сеть вернулась
    window.addEventListener('offline', () => ui.toast('Нет интернета — работаем из кэша'));
    window.addEventListener('online', () => {
      ui.toast('Снова онлайн');
      resync(3000);
    });

    // телефон вернулся в приложение из фона — обновляем данные, если давно не синхронизировались
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') resync(45000);
    });

    // пока приложение открыто, раз в минуту проверяем, не появилось ли нового
    setInterval(() => { if (!document.hidden) resync(90000); }, 60000);

    if (!location.hash) setHash('#/explore');
    render();

    // сессия по сохранённому токену + данные из D1
    if (SH.api && SH.api.enabled()) {
      store.restoreSession().then((restored) => {
        if (restored) render();
        // без сессии данные не запрашиваем: база закрыта токеном
        if (!store.isAuthed) return null;
        return SH.api.bootstrap();
      }).then((snapshot) => {
        if (snapshot && store.hydrate(snapshot)) render();
      }).catch(() => {});
    }

    // service worker: офлайн + автообновление приложения
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js');
          const hadController = !!navigator.serviceWorker.controller;
          let reloading = false;

          // новый воркер занял место старого → перезагружаем приложение один раз,
          // но не выдёргиваем экран из-под пальцев: ждём, пока пользователь не печатает
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!hadController || reloading) return;
            const attempt = () => {
              const f = document.activeElement;
              const busy = (f && /^(INPUT|TEXTAREA)$/.test(f.tagName)) ||
                document.querySelector('.sheet, .modal');
              if (busy) { setTimeout(attempt, 15000); return; }
              reloading = true;
              location.reload();
            };
            attempt();
          });

          // проверяем обновление при запуске и при возврате в приложение
          if (hadController) reg.update().catch(() => {});
          document.addEventListener('visibilitychange', () => {
            if (!document.hidden) reg.update().catch(() => {});
          });
        } catch (err) {
          console.warn('SW не зарегистрирован:', err.message);
        }
      });
    }
  }

  SH.app = app;
  SH.install = install;
  document.addEventListener('DOMContentLoaded', boot);
})(window.SH = window.SH || {});

/* ── адрес бэкенда (меняется при сборке) ── */
SH.api.configure('https://kk-test-project-s4ewq.warfacewtat.workers.dev');
if (SH.ai) SH.ai.endpoint = 'https://kk-test-project-s4ewq.warfacewtat.workers.dev/ai';

</script>
